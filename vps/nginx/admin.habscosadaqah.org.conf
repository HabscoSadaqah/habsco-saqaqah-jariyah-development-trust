server {
    listen 80;
    listen [::]:80;
    server_name admin.habscosadaqah.org;

    root /var/www/habsco-admin;
    index admin.html;

    # The admin hostname opens the administrator portal at /.
    location = / {
        try_files /admin.html =404;
    }

    # Utility payment API: browser -> VPS -> provider.
    # The VPS makes the outbound provider request, so the provider sees 45.43.27.75.
    location = /api/utility {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    # Static JavaScript, CSS, images and other portal dependencies.
    location / {
        try_files $uri $uri/ =404;
    }

    # Never expose repository/deployment metadata.
    location ~ ^/(?:\.git|\.github|vps)(?:/|$) {
        deny all;
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
