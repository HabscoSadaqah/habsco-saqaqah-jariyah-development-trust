server {
    listen 80;
    listen [::]:80;
    server_name admin.habscosadaqah.org utility-origin.habscosadaqah.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.habscosadaqah.org utility-origin.habscosadaqah.org;

    root /var/www/habsco-admin;
    index admin.html;

    ssl_certificate /etc/letsencrypt/live/admin.habscosadaqah.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.habscosadaqah.org/privkey.pem;

    location = / {
        try_files /admin.html =404;
    }

    location = /github-webhook {
        proxy_pass http://127.0.0.1:8787/github;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /github-webhook-health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/utility {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Headers "authorization, x-client-info, apikey, content-type" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "authorization, x-client-info, apikey, content-type" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(?:\.git|\.github|vps)(?:/|$) {
        deny all;
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
