name: Deploy Habsco Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify website files
        run: |
          test -f index.html
          test -f bill-payments.html
          test -f CNAME
          echo "Pages source verified"
          grep -q "habsco-utility-direct-v1" bill-payments.html
          echo "Current Bill Payments version verified"
          test -f member-actions.html
          grep -q "member-actions.js?v=20260920-2" member-actions.html
          echo "Current member actions version verified"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
