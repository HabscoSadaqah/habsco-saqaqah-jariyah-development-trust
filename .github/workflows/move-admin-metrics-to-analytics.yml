name: Move admin metrics to Analytics & Insights

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  move-metrics:
    if: "!contains(github.event.head_commit.message, '[admin-analytics-move]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move metrics section
        shell: python
        run: |
          from pathlib import Path

          path = Path('admin-single-page.js')
          text = path.read_text(encoding='utf-8')

          old_nav = "const navItems=[['dashboard','Dashboard','📊','Overview'],['wallet','Wallet','💳','Wallet operations'],['funding','Funding','📥','Funding queue'],['financing','Financing','🤝','Interest-free loans'],['members','Members','👥','Member management'],['security','Security','🛡️','Audit & oversight']];"
          new_nav = "const navItems=[['dashboard','Dashboard','📊','Overview'],['analytics','Analytics & Insights','📈','Key financial insights'],['wallet','Wallet','💳','Wallet operations'],['funding','Funding','📥','Funding queue'],['financing','Financing','🤝','Interest-free loans'],['members','Members','👥','Member management'],['security','Security','🛡️','Audit & oversight']];"

          old_dash = "const dash=makeView('dashboard','Operations overview','Live member and cooperative position');if(stats)dash.appendChild(stats);"
          new_dash = "const dash=makeView('dashboard','Operations overview','Quick access to administrator operations');const analytics=makeView('analytics','Analytics & Insights','Live member and cooperative financial insights');if(stats)analytics.appendChild(stats);"

          if "['analytics','Analytics & Insights'" in text:
              raise SystemExit('Analytics section already present; nothing to change.')
          if old_nav not in text:
              raise SystemExit('Expected admin navigation block not found.')
          if old_dash not in text:
              raise SystemExit('Expected dashboard metrics block not found.')

          text = text.replace(old_nav, new_nav, 1)
          text = text.replace(old_dash, new_dash, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit layout change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-single-page.js
          git commit -m "Move admin metrics to Analytics & Insights [admin-analytics-move]"
          git push