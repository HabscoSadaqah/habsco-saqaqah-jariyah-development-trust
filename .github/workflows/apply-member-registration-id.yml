name: Add member registration ID
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-member-dashboard:
    if: github.event.head_commit.message == 'chore: apply member registration id'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch member dashboard
        run: |
          python - <<'PY2'
          from pathlib import Path
          p = Path('member.js')
          s = p.read_text()
          old = 'function setMemberDashboardName(user){const welcome=$("welcome");if(!welcome)return;const metadata=user?.user_metadata||{},fullName=String(metadata.full_name||metadata.name||metadata.display_name||"").trim();fullName&&(welcome.textContent=fullName)}'
          new = 'function setMemberDashboardName(user){const welcome=$("welcome");if(!welcome)return;const metadata=user?.user_metadata||{},fullName=String(metadata.full_name||metadata.name||metadata.display_name||"").trim();fullName&&(welcome.textContent=fullName)}async function loadMemberRegistrationId(userId){const meta=$("memberMeta");if(!meta||!userId)return;try{const {data,error}=await supabaseClient.from("profiles").select("full_name,member_id").eq("id",userId).maybeSingle();if(error)throw error;if(data?.full_name&&$("welcome"))$("welcome").textContent=data.full_name;const id=String(data?.member_id||"").trim();meta.textContent=id?`Member Registration ID: ${id}`:"Member Registration ID: Pending";meta.style.fontWeight="800";meta.style.opacity="1"}catch(_){meta.textContent="Member Registration ID: Pending"}}'
          if old not in s:
              raise SystemExit('name function pattern not found')
          s = s.replace(old,new,1)
          old2 = 'setMemberDashboardName(session.user);const{data:rpc,error:rpcError}=await supabaseClient.rpc("member_dashboard_balances");'
          new2 = 'setMemberDashboardName(session.user);loadMemberRegistrationId(session.user.id);const{data:rpc,error:rpcError}=await supabaseClient.rpc("member_dashboard_balances");'
          if old2 not in s:
              raise SystemExit('dashboard call pattern not found')
          s = s.replace(old2,new2,1)
          p.write_text(s)
          PY2
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add member.js
          git diff --cached --quiet || git commit -m 'feat: show member registration ID on dashboard'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/apply-member-registration-id.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove temporary member ID workflow'
          git push
