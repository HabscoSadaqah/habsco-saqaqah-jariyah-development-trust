name: Inject savings page root fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('savings.html')
          s=p.read_text()
          tag='<script src="savings-page-root-fix.js?v=20260914-1"></script>'
          if tag not in s:
            s=s.replace('</body>',tag+'\n</body>')
            p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add savings.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: load savings page root fix"
          git push
      - name: Remove workflow
        if: success()
        run: |
          rm -f .github/workflows/inject-savings-page-fix.yml
          git add .github/workflows/inject-savings-page-fix.yml
          git commit -m "chore: remove one-time savings injector" || true
          git push || true
