name: HABSCO Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/habsco-android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: habsco-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not fully configured; the debug APK remains available."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release bundle
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-app/app/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Verify signed AAB
        if: steps.signing.outputs.ready == 'true'
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab | tail -n 5

      - name: Upload signed Play Store AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: habsco-release-aab-signed
          path: android-app/app/build/outputs/bundle/release/app-release.aab
