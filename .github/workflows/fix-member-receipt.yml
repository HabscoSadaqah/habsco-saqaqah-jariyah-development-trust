name: Fix member transaction receipt
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-receipt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch receipt renderer
        shell: python
        run: |
          from pathlib import Path
          path = Path('member.js')
          text = path.read_text(encoding='utf-8')
          start = text.find('function electricityReceiptToken(t){')
          click = text.find('document.addEventListener("click"', start)
          keydown = text.find('document.addEventListener("keydown"', click)
          if start < 0 or click < 0 or keydown < 0:
              raise SystemExit('Receipt block markers not found; refusing to modify member.js')
          end = text.find('});', keydown)
          if end < 0:
              raise SystemExit('Receipt keydown listener end not found')
          end += 3
          new_block = r'''function receiptMeta(t){
            const m=t?.metadata&&typeof t.metadata==='object'?t.metadata:{};
            const candidates=[m,m.provider_response,m.providerResponse,m.provider_history,m.providerHistory,m.provider_response?.provider_history,m.providerResponse?.providerHistory];
            const out={};
            for(const x of candidates){if(x&&typeof x==='object'&&!Array.isArray(x))Object.assign(out,x)}
            return out;
          }
          function electricityReceiptToken(t){
            const keys=['token','electricity_token','electricitytoken','electricityToken','vend_token','vendToken','token_number','tokenNumber','meter_token','vend_code','vendCode','token_code','tokenCode','pin','recharge_token','rechargeToken'];
            const walk=(x,d=0)=>{
              if(!x||d>14)return '';
              if(Array.isArray(x)){for(const v of x){const n=walk(v,d+1);if(n)return n}return ''}
              if(typeof x!=='object')return '';
              for(const k of keys){const v=x[k];if((typeof v==='string'||typeof v==='number')&&String(v).trim())return String(v).trim()}
              for(const k of Object.keys(x)){const n=walk(x[k],d+1);if(n)return n}
              return '';
            };
            return walk(t?.metadata||t);
          }
          function providerHistoryData(t){
            const m=t?.metadata&&typeof t.metadata==='object'?t.metadata:{};
            return m?.provider_response?.provider_history||m?.providerResponse?.providerHistory||m?.provider_history||m?.providerHistory||m?.provider_response||m?.providerResponse||m;
          }
          function providerScalarRows(t){
            const root=providerHistoryData(t),out=[],seen=new Set();
            const skip=new Set(['raw','request','request_body','requestBody','validation','vend','requery','provider_history','providerHistory','data','result','response','customer_info','customerInfo']);
            const label=k=>String(k).replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\b\w/g,m=>m.toUpperCase());
            const preferred=/provider|disco|meter|customer|account|address|phone|email|unit|tariff|vat|charge|amount|reference|transaction|status|category|package|plan|token|energy|receipt|commission/i;
            const walk=(x,path='',depth=0)=>{
              if(!x||typeof x!=='object'||depth>8)return;
              if(Array.isArray(x)){x.slice(0,30).forEach((v,i)=>walk(v,path+'['+i+']',depth+1));return}
              for(const k of Object.keys(x)){
                const v=x[k],key=String(k);
                if(skip.has(key))continue;
                const full=(path?path+' · ':'')+label(key);
                if(v!=null&&(typeof v==='string'||typeof v==='number'||typeof v==='boolean')){
                  const value=String(v).trim();
                  if(!value||value==='[object Object]')continue;
                  const id=key.toLowerCase()+'|'+value;
                  if(!seen.has(id)&&(preferred.test(key)||depth<2)){seen.add(id);out.push([full,value])}
                }else if(v&&typeof v==='object')walk(v,full,depth+1);
              }
            };
            walk(root);
            return out.slice(0,60);
          }
          function receiptProviderRows(t){return providerScalarRows(t).filter(([k,v])=>!/^Provider History|^Validation|^Vend|^Requery/i.test(k+' '));}
          function receiptLine(label,value){return '<div class="receipt-line"><span>'+escapeHtml(label)+'</span><b>'+escapeHtml(value==null||value===''?'—':value)+'</b></div>';}
          function receiptPrintHtml(t){
            const electricity=/electricity|power/i.test([t?.type,t?.description,t?.metadata?.service,t?.metadata?.action].filter(Boolean).join(' '));
            const token=electricity?electricityReceiptToken(t):'';
            const providerRows=receiptProviderRows(t);
            const title=electricity?'ELECTRICITY PAYMENT':'TRANSACTION RECEIPT';
            const rows=[['Date',t?.date||'—'],['Reference',t?.reference||'—'],['Transaction type',t?.type||'—'],['Full description',t?.description||'—'],['Status',String(t?.status||'approved').replace(/_/g,' ')],['Amount',(t?.credit?'+':'−')+' '+money(t?.amount||0)]];
            const detailRows=rows.map(([k,v])=>receiptLine(k,v)).join('');
            const provider=providerRows.length?'<section class="section"><h2>Provider / Electricity Details</h2><div class="details">'+providerRows.map(([k,v])=>receiptLine(k,v)).join('')+'</div></section>':'';
            const tokenBox=token?'<section class="token-box"><div class="token-label">ELECTRICITY TOKEN</div><div class="token">'+escapeHtml(token)+'</div><div class="token-note">Enter this token on your prepaid meter. Keep this receipt for your records.</div></section>':'';
            return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HABSCO '+escapeHtml(t?.reference||'Transaction')+'</title><style>@page{size:A4 portrait;margin:0}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#eef2ef;color:#17221c;font-family:Arial,Helvetica,sans-serif}.receipt{width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:14mm 15mm 16mm;position:relative}.watermark{position:absolute;top:130mm;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-size:80pt;font-weight:900;letter-spacing:8px;color:#087443;opacity:.035}.head{display:flex;justify-content:space-between;gap:10mm;align-items:flex-start;border-bottom:2px solid #087443;padding-bottom:6mm}.brand{font-size:25pt;font-weight:900;letter-spacing:2px;color:#087443}.sub{font-size:7pt;letter-spacing:1.4px;color:#68756e;margin-top:1mm}.right{text-align:right}.kicker{font-size:7.5pt;font-weight:900;letter-spacing:1px;color:#087443}.title{font-size:16pt;font-weight:900;color:#173d2e;margin-top:1.5mm}.section{margin-top:7mm}.section h2{font-size:8.5pt;text-transform:uppercase;letter-spacing:.9px;color:#087443;border-bottom:1px solid #dfe9e3;padding-bottom:2.5mm;margin:0 0 3mm}.details{border:1px solid #dfe9e3;border-radius:3mm;overflow:hidden}.receipt-line{display:flex;justify-content:space-between;gap:8mm;padding:3.1mm 4mm;border-bottom:1px solid #edf1ee;font-size:9pt}.receipt-line:last-child{border-bottom:0}.receipt-line span{color:#68756e}.receipt-line b{font-weight:750;text-align:right;overflow-wrap:anywhere}.token-box{margin-top:6mm;border:2px solid #087443;border-radius:4mm;background:#f2faf5;padding:6mm;text-align:center}.token-label{font-size:8.5pt;font-weight:900;letter-spacing:1.5px;color:#087443}.token{margin-top:3mm;font-family:"Courier New",monospace;font-size:19pt;font-weight:900;letter-spacing:2px;color:#173d2e;overflow-wrap:anywhere}.token-note{margin-top:2mm;font-size:7.5pt;color:#718079}.footer{margin-top:12mm;border-top:1px solid #dfe9e3;padding-top:3mm;display:flex;justify-content:space-between;font-size:6.5pt;color:#7a8780}</style></head><body><main class="receipt"><div class="watermark">HABSCO</div><header class="head"><div><div class="brand">HABSCO</div><div class="sub">SADAQAH JARIYAH DEVELOPMENT TRUST</div></div><div class="right"><div class="kicker">OFFICIAL TRANSACTION DOCUMENT</div><div class="title">'+title+'</div><div class="meta">HABSCO</div></div></header><section class="section"><h2>Transaction Details</h2><div class="details">'+detailRows+'</div>'+tokenBox+'</section>'+provider+'</main><footer class="footer"><span>HABSCO · OFFICIAL TRANSACTION DOCUMENT</span><span>Generated '+escapeHtml(new Date().toLocaleString('en-NG'))+'</span></footer></body></html>';
          }
          function receiptPdfBlob(t){return new Blob([receiptPrintHtml(t)],{type:'text/html;charset=utf-8'});}
          function closeRecentReceipt(){const el=document.getElementById('hfRecentReceipt');if(el)el.remove();document.body.style.overflow='';}
          function normalizeReceiptBrand(value){return String(value||'HABSCO').replace(/HARSCO/gi,'HABSCO').trim()||'HABSCO';}
          function showRecentReceipt(t){
            closeRecentReceipt();
            const electricity=/electricity|power/i.test([t?.type,t?.description,t?.metadata?.service,t?.metadata?.action].filter(Boolean).join(' '));
            const pending=String(t?.status||'').toLowerCase()==='pending';
            const token=electricity?electricityReceiptToken(t):'';
            const providerRows=electricity?receiptProviderRows(t):[];
            const wrap=document.createElement('div');wrap.id='hfRecentReceipt';
            const line=receiptLine;
            const detail=line('Date',t?.date)+line('Reference',t?.reference)+line('Transaction type',t?.type)+line('Full description',t?.description)+line('Status',String(t?.status||'approved').replace(/_/g,' '));
            wrap.innerHTML='<div class="recent-receipt-backdrop"></div><section class="recent-receipt-sheet" role="dialog" aria-modal="true"><button type="button" class="recent-receipt-close" aria-label="Close">×</button><div class="recent-receipt-head"><div class="recent-receipt-brand">'+normalizeReceiptBrand('HABSCO')+'<small>'+(electricity?'ELECTRICITY PAYMENT':'TRANSACTION DOCUMENT')+'</small></div><span>OFFICIAL TRANSACTION RECEIPT</span></div><div class="recent-receipt-body"><div class="receipt-details">'+detail+'</div>'+(token?'<div class="receipt-token"><small>ELECTRICITY TOKEN</small><strong>'+escapeHtml(token)+'</strong><em>Keep this token for your meter.</em></div>':'')+'<div class="receipt-total"><span>'+(electricity?'Total amount paid':'Transaction amount')+'</span><b>'+(t?.credit?'+':'−')+' '+money(t?.amount||0)+'</b></div><div class="receipt-status">'+escapeHtml(String(t?.status||'approved').replace(/_/g,' '))+'</div>'+(providerRows.length?'<div class="provider-details"><h4>Provider / Electricity Details</h4>'+providerRows.map(([k,v])=>line(k,v)).join('')+'</div>':'')+'</div><div class="recent-receipt-actions"><button type="button" class="recent-receipt-share">Print / Save PDF</button></div></section>';
            const css=document.createElement('style');css.dataset.habscoElectricityReceipt='1';css.textContent='#hfRecentReceipt .recent-receipt-sheet{max-height:92vh;overflow:auto}#hfRecentReceipt .recent-receipt-requery{width:100%;margin-bottom:8px;padding:11px;border:0;border-radius:10px;background:#087443;color:#fff;font-weight:900;cursor:pointer}#hfRecentReceipt .recent-receipt-requery:disabled{opacity:.65;cursor:wait}#hfRecentReceipt .recent-receipt-requery-msg{margin:6px 0 9px;padding:8px 10px;border-radius:8px;background:#fff7e8;color:#8a5a00;font-size:9px}#hfRecentReceipt .recent-receipt-brand{font-size:18px;font-weight:900;letter-spacing:1px;color:#087443}#hfRecentReceipt .recent-receipt-brand small{display:block;font-size:7px;letter-spacing:1px;color:#718079;margin-top:2px}#hfRecentReceipt .receipt-details{border:1px solid #dfe9e3;border-radius:10px;overflow:hidden}#hfRecentReceipt .receipt-line{display:flex;justify-content:space-between;gap:14px;padding:9px;border-bottom:1px solid #edf1ee;font-size:10px}#hfRecentReceipt .receipt-line:last-child{border-bottom:0}#hfRecentReceipt .receipt-line span{color:#68756e}#hfRecentReceipt .receipt-line b{overflow-wrap:anywhere;text-align:right;color:#173d2e}#hfRecentReceipt .receipt-token{margin:13px 0;padding:14px;border:2px solid #087443;border-radius:10px;background:#f2faf5;text-align:center}#hfRecentReceipt .receipt-token small{display:block;color:#087443;font-size:8px;font-weight:900;letter-spacing:1px}#hfRecentReceipt .receipt-token strong{display:block;margin-top:7px;font:900 19px/1.3 "Courier New",monospace;letter-spacing:1.5px;overflow-wrap:anywhere;color:#173d2e}#hfRecentReceipt .receipt-token em{display:block;margin-top:5px;font-size:8px;color:#718079;font-style:normal}#hfRecentReceipt .receipt-total{display:flex;justify-content:space-between;align-items:center;margin:14px 0;padding:12px;border:1px solid #087443;border-radius:10px;background:#f7fbf8;font-size:11px}#hfRecentReceipt .receipt-total b{font-size:17px;color:#9a2f2f}#hfRecentReceipt .provider-details{margin-top:14px;padding-top:10px;border-top:1px solid #dfe9e3}#hfRecentReceipt .provider-details h4{margin:0 0 6px;font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:#087443}#hfRecentReceipt .receipt-status{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:20px;background:#eaf6ef;color:#087443;font-size:8px;font-weight:900;text-transform:uppercase}';document.head.appendChild(css);document.body.appendChild(wrap);document.body.style.overflow='hidden';
            if(electricity&&pending){const q=document.createElement('button');q.type='button';q.className='recent-receipt-requery';q.textContent='CHECK PAYMENT STATUS';wrap.querySelector('.recent-receipt-actions').prepend(q);if(typeof requeryPendingUtilityReceipt==='function')q.onclick=()=>requeryPendingUtilityReceipt(t,q,wrap);else q.onclick=()=>alert('Payment status checker is unavailable. Please refresh the dashboard and try again.');}
            wrap.querySelector('.recent-receipt-close').onclick=closeRecentReceipt;wrap.querySelector('.recent-receipt-backdrop').onclick=closeRecentReceipt;
            wrap.querySelector('.recent-receipt-share').onclick=()=>{const html=receiptPrintHtml(t);const w=window.open('','_blank');if(w){w.document.open();w.document.write(html);w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(e){}},350);return;}const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='HABSCO-'+String(t?.reference||'transaction')+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);alert('The receipt was prepared as a print-ready file. Open it and choose Print → Save as PDF.');};
          }
          document.addEventListener('click',e=>{const close=e.target.closest('#hfRecentReceipt .recent-receipt-close,#hfRecentReceipt .recent-receipt-backdrop');if(close){e.preventDefault();e.stopPropagation();closeRecentReceipt();return}const b=e.target.closest('.activity-view-receipt');if(!b)return;try{showRecentReceipt(JSON.parse(decodeURIComponent(b.dataset.receipt)))}catch(err){console.warn('Receipt unavailable:',err)}});
          document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('hfRecentReceipt')){e.preventDefault();closeRecentReceipt()}});'''
          text = text[:start] + new_block + text[end:]
          path.write_text(text,encoding='utf-8')
          print('receipt block patched:', path)
      - name: Commit patched receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add member.js
          if git diff --cached --quiet; then
            echo "No receipt changes needed"
            exit 0
          fi
          git commit -m "Fix member transaction receipt and PDF flow"
          git push
