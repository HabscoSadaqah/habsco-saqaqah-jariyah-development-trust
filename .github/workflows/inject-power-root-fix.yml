name: Attach utility integrations
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  attach:
    if: github.event.head_commit.message != 'chore: attach utility integrations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach utility scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Habsco Sadaqah Jariyah Development Trust'
          git config user.email '70951857+HabscoSadaqah@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            python - <<'PY'
            from pathlib import Path
            p=Path('bill-payments.html')
            s=p.read_text(encoding='utf-8')
            tags=[
              '<script src="power-root-fix.js?v=20260914-2"></script>',
              '<script src="education-root-fix.js?v=20260914-2"></script>',
              '<script src="data-root-fix.js?v=20260914-2"></script>'
            ]
            for tag in tags:
              if tag not in s:
                if '</body>' not in s:
                  raise SystemExit('bill-payments.html has no closing body tag')
                s=s.replace('</body>',tag+'</body>',1)
            p.write_text(s,encoding='utf-8')
            PY
            git add bill-payments.html
            if git diff --cached --quiet; then
              echo 'Utility integrations already attached.'
              exit 0
            fi
            git commit -m 'chore: attach utility integrations'
            if git push origin HEAD:main; then
              echo 'Utility integrations attached successfully.'
              exit 0
            fi
            git reset --hard origin/main
            sleep 3
          done
          echo 'Unable to push utility integration commit after retries.'
          exit 1
