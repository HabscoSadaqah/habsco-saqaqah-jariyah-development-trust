name: Inject electricity root fix
on:
  push:
    branches: [main]

jobs:
  inject:
    if: github.event.head_commit.message != 'chore: inject electricity root fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject root electricity script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bill-payments.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="power-root-fix.js?v=20260914-1"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('bill-payments.html has no closing body tag')
              s=s.replace(marker,tag+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit injected script
        run: |
          git config user.name 'Habsco Sadaqah Jariyah Development Trust'
          git config user.email '70951857+HabscoSadaqah@users.noreply.github.com'
          git add bill-payments.html
          git diff --cached --quiet || git commit -m 'chore: inject electricity root fix'
          git push