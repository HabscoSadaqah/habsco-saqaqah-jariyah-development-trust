name: Deploy Admin Portal to VPS

on:
  push:
    branches: [main]
    paths:
      - "admin.html"
      - "admin.js"
      - "admin-*.js"
      - "inventory.html"
      - "inventory.js"
      - "vps/**"
      - "bill-payments.html"
      - "bill-payments-root-fix.js"
      - ".github/workflows/deploy-admin-vps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy repository to Habsco VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          KEY="$VPS_SSH_KEY"
          KEY="${KEY//\r/}"

          if [[ "$KEY" == id_ed25519 || "$KEY" == id_rsa || "$KEY" == *.pub ]]; then
            echo "VPS_SSH_KEY contains a filename/public key, not a private-key value." >&2
            exit 1
          fi

          if [[ "$KEY" == *"BEGIN OPENSSH PRIVATE KEY"* || "$KEY" == *"BEGIN PRIVATE KEY"* || "$KEY" == *"BEGIN RSA PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY" > ~/.ssh/habsco_vps
          else
            if ! printf '%s' "$KEY" | base64 -d > ~/.ssh/habsco_vps 2>/dev/null; then
              echo "VPS_SSH_KEY is neither a raw private key nor valid Base64." >&2
              exit 1
            fi
          fi

          chmod 600 ~/.ssh/habsco_vps

          if ! ssh-keygen -y -f ~/.ssh/habsco_vps >/dev/null; then
            echo "VPS_SSH_KEY could not be parsed as a private SSH key." >&2
            exit 1
          fi

          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/habsco_vps -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" '
            set -e
            cd /var/www/habsco-admin
            git fetch origin main
            git reset --hard origin/main
            bash vps/setup-admin-vps.sh
            bash vps/setup-utility-gateway.sh
            nginx -t
            systemctl reload nginx
          '

          rm -f ~/.ssh/habsco_vps
