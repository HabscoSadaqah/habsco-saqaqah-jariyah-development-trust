name: Attach admin analytics fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach fix script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          tag='<script src="admin-analytics-fix.js?v=20260914-1"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'</body></html>')
              p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet || git commit -m "fix: attach admin analytics placement"
          git push
