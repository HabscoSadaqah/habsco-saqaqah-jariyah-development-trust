name: Attach admin analytics fix
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify analytics script is attached
        run: |
          grep -q 'admin-analytics-fix.js?v=20260914-3' admin.html
          echo 'Admin analytics fix is already attached to admin.html.'
