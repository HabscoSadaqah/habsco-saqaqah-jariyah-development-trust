name: Attach admin analytics fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  attach:
    if: github.event.head_commit.message != 'fix: attach admin analytics placement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync with latest main
        run: git fetch origin main && git reset --hard origin/main
      - name: Attach fix script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="admin-analytics-fix.js?v=20260914-3"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('admin.html has no closing body tag')
              s=s.replace(marker,tag+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only when changed
        run: |
          git config user.name 'Habsco Sadaqah Jariyah Development Trust'
          git config user.email '70951857+HabscoSadaqah@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'Admin analytics script is already attached; nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: attach admin analytics placement'
          git push origin main
