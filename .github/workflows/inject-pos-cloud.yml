name: Inject POS cloud and receipts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject POS scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pos.html')
          s=p.read_text()
          import re
          s=re.sub(r'<script>\(\(\)=>\{const K=.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2\.56\.0"></script>.*?</body>', '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.56.0"></script><script src="pos-cloud.js?v=20260916"></script><script src="pos-receipts.js?v=20260916-1"></script></body>', s, flags=re.S)
          if 'pos-receipts.js?v=20260916-1' not in s:
              s=s.replace('</body>','<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.56.0"></script><script src="pos-cloud.js?v=20260916"></script><script src="pos-receipts.js?v=20260916-1"></script></body>')
          p.write_text(s)
          PY
          git config user.name 'HabscoSadaqah'
          git config user.email '70951857+HabscoSadaqah@users.noreply.github.com'
          git add pos.html
          git diff --cached --quiet || git commit -m 'Enable POS receipt and invoice downloads'
          git push
