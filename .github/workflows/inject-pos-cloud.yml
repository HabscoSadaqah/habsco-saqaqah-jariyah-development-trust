name: Inject POS cloud client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject POS cloud client
        shell: bash
        run: |
          set -euo pipefail
          test -f pos.html

          python - <<'PY'
          from pathlib import Path

          path = Path("pos.html")
          html = path.read_text(encoding="utf-8")

          supabase_tag = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.56.0"></script>'
          cloud_tag = '<script src="pos-cloud.js?v=20260916"></script>'

          # Remove duplicate copies of the managed cloud tags, then add exactly one
          # copy of each immediately before the closing body tag.
          import re
          html = re.sub(
              r'<script[^>]+src=["\']https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@2\.56\.0["\'][^>]*></script>',
              '',
              html,
              flags=re.I,
          )
          html = re.sub(
              r'<script[^>]+src=["\']pos-cloud\.js(?:\?[^"\']*)?["\'][^>]*></script>',
              '',
              html,
              flags=re.I,
          )

          tags = supabase_tag + cloud_tag
          if re.search(r'</body>\s*</html>\s*$', html, flags=re.I):
              html = re.sub(r'</body>', tags + '</body>', html, count=1, flags=re.I)
          else:
              html += tags

          path.write_text(html, encoding="utf-8")
          PY

          git config user.name 'HabscoSadaqah'
          git config user.email '70951857+HabscoSadaqah@users.noreply.github.com'
          git add pos.html
          if git diff --cached --quiet; then
            echo "POS cloud client is already correctly installed."
          else
            git commit -m "Fix POS cloud client injection"
            git push origin HEAD:main
          fi
