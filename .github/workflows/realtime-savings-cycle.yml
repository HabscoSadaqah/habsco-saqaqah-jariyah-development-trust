name: Fix realtime savings cycle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-savings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch savings cycle logic
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('savings.html')
          s = p.read_text()

          start = s.find('async function refresh(){')
          end = s.find('async function setPlan', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate savings refresh function')

          new_refresh = r'''async function refresh(){
          const {data:ses}=await sb.auth.getSession();
          uid=ses?.session?.user?.id;
          if(!uid){location.href='auth.html';return}
          try{
            const r=await sb.from('member_savings_eligibility').select('*').eq('user_id',uid).maybeSingle();
            if(r.error)throw r.error;
            if(r.data)elig={...elig,...r.data};
          }catch(_){
            try{
              const r=await sb.from('member_cooperative_accounts').select('savings_balance').eq('user_id',uid).maybeSingle();
              elig.savings_balance=Number(r.data?.savings_balance||0);
              elig.loan_limit=elig.savings_balance*2;
              elig.eligible=false;
            }catch(__){}
          }
          try{
            const r=await sb.from('member_savings_plans').select('*').eq('user_id',uid).maybeSingle();
            plan=r.data||null;
          }catch(_){}
          const since=elig.cycle_start_at||elig.qualifying_since;
          const journey=elig.loan_eligible?{months:6,percent:100}:calcJourney(since);
          const count=Math.min(6,Number(journey.months||0));
          const remaining=Math.max(0,6-count);
          $('savingsBalance').textContent=money(elig.savings_balance);
          $('months').textContent=count+' / 6 months';
          $('loanLimit').textContent=money(elig.loan_eligible?elig.savings_balance*2:Number(elig.savings_balance||0)*2);
          $('status').textContent=elig.loan_eligible?'Eligible':'In progress';
          $('percent').textContent=Number(journey.percent||0)+'%';
          $('bar').style.width=Number(journey.percent||0)+'%';
          $('progressText').textContent=elig.loan_eligible?'You have completed the six-month requirement. You may apply for an interest-free loan of up to twice your current Savings balance.':remaining+' month'+(remaining===1?'':'s')+' remaining to reach loan eligibility.';
          const cta=$('eligibilityCta');
          cta.style.display=elig.loan_eligible?'block':'none';
          $('eligibleAmount').textContent='Available loan limit: '+money(elig.savings_balance*2);
          if(plan){
            $('frequency').value=plan.frequency||'monthly';
            $('amount').value=String(plan.fixed_amount||5000);
            $('frequency').disabled=true;
            $('amount').disabled=true;
            $('setPlan').disabled=true;
            $('setPlan').textContent='Savings Plan Active';
            $('planStatus').textContent='Active: '+money(plan.fixed_amount)+' · '+(plan.frequency||'monthly')+' savings.';
            $('pay').textContent='Pay '+money(plan.fixed_amount);
          }else{
            $('pay').disabled=true;
            $('pay').textContent='Set Plan First';
          }
          $('loan').style.pointerEvents=elig.loan_eligible?'auto':'none';
          $('loan').style.opacity=elig.loan_eligible?'1':'.5';
          }
          '''
          s = s[:start] + new_refresh + s[end:]

          # Keep the journey current while the page remains open.
          marker = "setInterval(refresh,60000);"
          if marker not in s:
              s = s.replace("$('setPlan').onclick=setPlan;", "$('setPlan').onclick=setPlan;\n          setInterval(()=>{if(document.visibilityState==='visible')refresh()},60000);")

          p.write_text(s)

          p = Path('savings-borrowing-ui.js')
          s = p.read_text()
          start = s.find('async function refresh(id){')
          end = s.find('function pinPrompt', start)
          if start != -1 and end != -1:
              new_refresh = r'''async function refresh(id){
          try{
            const {data,error}=await sb.from('member_savings_eligibility').select('*').eq('user_id',id).maybeSingle();
            if(error)throw error;
            if(data){
              elig={...elig,...data,eligible:!!data.loan_eligible};
              elig.months_completed=Math.max(0,Math.min(6,Math.floor(Number(data.progress_percent||0)*6/100)));
              elig.months_remaining=Math.max(0,6-elig.months_completed);
              elig.qualifying_since=data.cycle_start_at||null;
            }
          }catch(_){
            try{
              const {data}=await sb.from('member_cooperative_accounts').select('savings_balance').eq('user_id',id).maybeSingle();
              elig.savings_balance=Number(data?.savings_balance||0);
              elig.loan_limit=elig.savings_balance*2;
            }catch(__){}
          }
          try{const {data}=await sb.from('member_savings_plans').select('*').eq('user_id',id).maybeSingle();plan=data||null}catch(_){}
          const percent=Math.max(0,Math.min(100,Number(elig.progress_percent||0)));
          const months=Math.max(0,Math.min(6,Number(elig.months_completed||0)));
          progress={saved:months,percent,goal:6,unit:'month',plural:'months'};
          }
          '''
              s = s[:start] + new_refresh + s[end:]
              s = s.replace("<span>'+p.saved+' '+(p.saved===1?p.unit:p.plural)+' saved</span>", "<span>'+m+' month'+(m===1?'':'s')+' completed</span>")
              s = s.replace("<span>Goal: '+p.goal+' '+p.plural+'</span>", "<span>Goal: 6 months</span>")
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add savings.html savings-borrowing-ui.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Make savings six-month journey realtime"
            git push
          fi
