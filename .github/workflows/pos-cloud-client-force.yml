name: Force POS cloud client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  force-pos-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify POS cloud client references
        shell: bash
        run: |
          set -euo pipefail
          test -f member.html
          grep -RniE 'POS|pos|supabase|cloud' --include='*.js' --include='*.html' . | head -n 200 || true
          echo 'POS cloud-client verification completed.'

      - name: Force fresh POS asset version
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pos-cloud-client.js ]; then
            printf '\n/* force-refresh: %s */\n' "$(date -u +%Y%m%d%H%M%S)" >> pos-cloud-client.js
          elif [ -f pos.js ]; then
            printf '\n/* force-refresh: %s */\n' "$(date -u +%Y%m%d%H%M%S)" >> pos.js
          else
            echo 'No standalone POS cloud client file found; verification only.'
          fi

      - name: Commit forced refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HabscoSadaqah'
          git config user.email '70951857+HabscoSadaqah@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No POS asset change required.'
          else
            git commit -m 'Force POS cloud client refresh and verification'
            git push origin HEAD:main
          fi
