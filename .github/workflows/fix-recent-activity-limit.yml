name: Fix Recent Activity Limit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Limit Recent Activity to 5 rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('member.js')
          s = p.read_text(encoding='utf-8')
          old = '.limit(20);if(error)return void(list.innerHTML='
          new = '.limit(5);if(error)return void(list.innerHTML='
          if old not in s:
              raise SystemExit('Expected Recent Activity query was not found; refusing to modify the file.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit only member.js and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-recent-activity-limit.yml
          git config user.name 'HabscoSadaqah'
          git config user.email '70951857+HabscoSadaqah@users.noreply.github.com'
          git add member.js .github/workflows/fix-recent-activity-limit.yml
          git diff --cached --check
          git diff --cached -- member.js
          git commit -m 'Limit Recent Activity to 5 rows'
          git push origin HEAD:main
