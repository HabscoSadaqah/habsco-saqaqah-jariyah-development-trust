name: Minify assets

# Disabled: automatic asset rewriting after every push can create stale or
# mismatched browser assets during deployment. Keep committed CSS/JS stable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minify:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automatic asset minification is disabled."
