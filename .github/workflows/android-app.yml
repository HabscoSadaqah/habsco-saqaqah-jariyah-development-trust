name: Build HABSCO Android App

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build release bundle
        run: gradle bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: habsco-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: habsco-release-aab-unsigned
          path: android-app/app/build/outputs/bundle/release/app-release.aab
