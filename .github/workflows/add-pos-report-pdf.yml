name: Wire POS report PDF
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: wire-pos-report-pdf
  cancel-in-progress: true
jobs:
  wire:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire PDF exporter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('pos.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="pos-report-pdf.js?v=20260919-1"></script>'
          s = re.sub(r'<script\s+src=["\']pos-report-pdf\.js\?v=[^"\']+["\']></script>', '', s)
          if '</body>' not in s:
              raise SystemExit('pos.html has no closing body tag')
          s = s.replace('</body>', tag + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit wiring change safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pos.html
          git diff --cached --quiet && exit 0
          git commit -m 'Wire POS full P/L PDF export'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
