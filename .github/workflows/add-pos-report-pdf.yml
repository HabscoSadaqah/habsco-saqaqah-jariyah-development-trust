name: Wire POS report PDF
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add PDF exporter script to POS page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pos.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="pos-report-pdf.js?v=20260916-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          else:
              raise SystemExit(0)
          PY
      - name: Commit wiring change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pos.html
          git diff --cached --quiet || git commit -m 'Wire POS full P/L PDF export'
          git push