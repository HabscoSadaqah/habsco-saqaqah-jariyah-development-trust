<!doctype html>
<html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063b29"><title>Bill Payments | Habsco Finance</title><link rel="icon" href="favicon.svg"><style>:root{--g:#087443;--d:#063b29;--bg:#f5f8f6;--line:#dfe9e3;--text:#17221c;--muted:#728079;--red:#a22c24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.page{max-width:720px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:900;color:var(--g);font-size:14px}.back{color:var(--g);font-size:11px;font-weight:900;text-decoration:none}.hero{background:linear-gradient(135deg,var(--d),var(--g));color:#fff;border-radius:22px;padding:23px;box-shadow:0 15px 35px #063d2620}.hero small{opacity:.75;font-weight:900;letter-spacing:1px}.hero h1{margin:7px 0 4px;font-size:28px}.hero p{margin:0;color:#d9ece1;font-size:11px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:12px}.panel h2{font-size:15px;margin:0 0 13px}.field{margin-top:11px}.field label{display:block;color:var(--muted);font-size:9px;font-weight:900;margin-bottom:5px}.field input,.field select{width:100%;height:48px;border:1px solid var(--line);border-radius:11px;background:#fbfdfc;padding:0 13px;font-size:13px;outline:none}.field input:focus,.field select:focus{border-color:var(--g);box-shadow:0 0 0 3px #08744312}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.button{width:100%;height:49px;margin-top:14px;border:0;border-radius:11px;background:var(--g);color:#fff;font-weight:900;cursor:pointer}.button:disabled{opacity:.55;cursor:wait}.status{display:none;margin-top:11px;padding:10px;border-radius:10px;font-size:10px;line-height:1.45}.status.show{display:block}.status.ok{background:#edf8f2;color:#087443}.status.err{background:#fff1ef;color:var(--red)}.note{margin-top:11px;color:var(--muted);font-size:9px;line-height:1.5}.pin{letter-spacing:5px;text-align:center;font-size:18px!important}.providers{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.providers button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:10px;font-weight:850;color:var(--text);cursor:pointer}.providers button.active{border-color:var(--g);background:#edf8f2;color:var(--g)}@media(max-width:560px){.page{padding:12px}.hero{padding:19px;border-radius:18px}.grid{grid-template-columns:1fr}.panel{padding:14px}}</style></head><body><main class="page"><div class="top"><div class="brand">HABSCO FINANCE</div><a class="back" href="member.html">← Dashboard</a></div><section class="hero"><small>EVERYDAY PAYMENTS</small><h1>Bill Payments</h1><p>Secure Airtime purchases through the Accelerate Merchant API.</p></section><section class="panel"><h2>Airtime</h2><div class="providers" id="providers"><button type="button" data-provider="MTN">MTN</button><button type="button" data-provider="GLO">GLO</button><button type="button" data-provider="AIRTEL">AIRTEL</button><button type="button" data-provider="9MOBILE">9MOBILE</button></div><div class="grid"><div class="field"><label for="phone">Receiver phone number</label><input id="phone" inputmode="tel" maxlength="16" placeholder="08012345678"></div><div class="field"><label for="amount">Amount (NGN)</label><input id="amount" inputmode="decimal" type="number" min="1" step="1" placeholder="100"></div></div><div class="field"><label for="pin">Transaction PIN</label><input id="pin" class="pin" inputmode="numeric" maxlength="6" type="password" placeholder="••••••" autocomplete="off"></div><button class="button" id="pay">Continue Airtime Purchase</button><div id="status" class="status" role="status" aria-live="polite"></div><div class="note">Your wallet is reserved only through the authenticated server-side transaction flow. The Accelerate private key is never exposed to this page.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://ythnoeyxovapydbmymdo.supabase.co';const SUPABASE_KEY='sb_publishable_nfSR2tMCFuHCpkOjjNIakw_P85zunsN';const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let provider='';const statusEl=document.getElementById('status');const pay=document.getElementById('pay');const show=(text,ok=false)=>{statusEl.textContent=text;statusEl.className='status show '+(ok?'ok':'err')};document.querySelectorAll('[data-provider]').forEach(b=>b.onclick=()=>{provider=b.dataset.provider;document.querySelectorAll('[data-provider]').forEach(x=>x.classList.toggle('active',x===b))});(async()=>{const {data:{session}}=await supabase.auth.getSession();if(!session)location.href='auth.html';})();pay.onclick=async()=>{const {data:{session}}=await supabase.auth.getSession();if(!session){location.href='auth.html';return}const phone=document.getElementById('phone').value.trim(),amount=Number(document.getElementById('amount').value),pin=document.getElementById('pin').value.trim();if(!provider)return show('Select an airtime provider.');if(!/^\+?234\d{10}$|^0\d{10}$/.test(phone))return show('Enter a valid Nigerian receiver phone number.');if(!Number.isFinite(amount)||amount<=0)return show('Enter a valid amount.');if(!/^\d{6}$/.test(pin))return show('Enter your 6-digit transaction PIN.');pay.disabled=true;pay.textContent='Processing…';statusEl.className='status';try{const {data,error}=await supabase.functions.invoke('accelerate-billvending',{body:{action:'airtime',provider,receiver:phone,amount,transaction_pin:pin}});if(error)throw error;if(data?.pending){show('Your airtime request was accepted and is still processing. Reference: '+data.reference,true)}else if(data?.success){show('Airtime purchase completed successfully. Reference: '+data.reference,true)}else throw new Error(data?.error||'Airtime purchase failed.')}catch(e){show(String(e?.message||'Airtime purchase failed.').replace(/^.*?: /,''))}finally{pay.disabled=false;pay.textContent='Continue Airtime Purchase'}};</script></body></html>
