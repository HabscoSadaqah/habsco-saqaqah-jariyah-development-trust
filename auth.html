<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073b29">
<title>Hassan Finance | Login</title><link rel="icon" href="favicon.svg">
<style>
:root{--green:#087a43;--deep:#073b29;--ink:#14221c;--muted:#738078;--line:#dfe7e2;--soft:#f6f8f7;--white:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--soft);-webkit-font-smoothing:antialiased}body{min-height:100vh}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.shell{width:min(100%,1000px);display:grid;grid-template-columns:.8fr 1.2fr;background:#fff;border-radius:22px;overflow:hidden}.brand-panel{background:var(--deep);color:#fff;padding:44px;display:flex;flex-direction:column;justify-content:space-between;min-height:590px}.brand{display:flex;align-items:center;gap:13px}.brand img{width:64px;height:64px;object-fit:contain;display:block;flex:none}.brand b{font-size:14px;font-weight:900;letter-spacing:.9px;line-height:1}.brand-copy{max-width:320px}.brand-copy h2{font-size:38px;line-height:1.02;letter-spacing:-1.7px;margin:0;font-weight:850}.brand-copy p{font-size:12px;line-height:1.5;color:#d5e6dd;margin:12px 0 0;max-width:270px}.brand-foot{font-size:9px;color:#b8d2c5;line-height:1.4}.auth-area{padding:44px;display:flex;align-items:center}.card{width:100%;max-width:430px;margin:auto}.mobile-brand{text-align:center;display:none}.mobile-brand img{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto}.mobile-brand h1{font-size:21px;letter-spacing:-.4px;margin:10px 0 0;font-weight:850}.heading{text-align:left}.heading h1{margin:6px 0 20px;font-size:29px;line-height:1.1;letter-spacing:-1px;font-weight:800}.eyebrow{font-size:9px;letter-spacing:1.5px;font-weight:900;color:var(--green)}.tabs{display:flex;gap:3px;background:#f0f4f1;padding:3px;border-radius:10px;margin-bottom:18px}.tabs button{flex:1;border:0;background:transparent;color:#77827c;border-radius:7px;height:40px;font-size:10px;font-weight:900;letter-spacing:.4px;cursor:pointer}.tabs button.active{background:#fff;color:var(--green);box-shadow:0 1px 5px #173d2b10}.name-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field,label{display:block}.field label,label{font-size:10px;font-weight:800;color:#34443b;margin:10px 0 6px}.field input,input{width:100%;height:46px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 12px;color:var(--ink);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}.field input:focus,input:focus{border-color:#77b997;box-shadow:0 0 0 3px #087a4310}.submit{width:100%;height:48px;margin-top:17px;border:0;border-radius:9px;background:var(--green);color:#fff;font-size:12px;font-weight:900;letter-spacing:.3px;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.forgot{text-align:right;margin-top:6px}.forgot button{border:0;background:none;color:var(--green);font-size:10px;font-weight:800;cursor:pointer;padding:4px}.biometric-login{width:100%;height:44px;margin-top:9px;border:1px solid #ccd8d1;border-radius:9px;background:#fff;color:#176f47;font-weight:850;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}.biometric-login:disabled{opacity:.6}.bio-icon{width:17px;height:17px}.bio-hint{text-align:center;color:#87928c;font-size:8px;margin-top:5px}.message{margin-top:11px;padding:9px 10px;border-radius:8px;display:none;font-size:10px;line-height:1.4}.message.show{display:block}.secure-note{text-align:center;margin-top:17px;padding-top:12px;border-top:1px solid #edf1ee;color:#7b8780;font-size:8px}.secure-note b{color:#405148}.back{text-align:center;margin-top:10px}.back a{color:var(--green);font-size:9px;font-weight:850;text-decoration:none}.hidden{display:none!important}@media(max-width:780px){.page{padding:0;background:#fff}.shell{min-height:100vh;display:block;border-radius:0}.brand-panel{display:none}.auth-area{min-height:100vh;padding:28px 20px 18px}.card{max-width:460px}.mobile-brand{display:block;margin-bottom:21px}.heading{text-align:center}.heading h1{font-size:25px;margin-bottom:18px}.eyebrow{display:none}}@media(max-width:430px){.auth-area{padding:22px 16px 17px}.mobile-brand img{width:68px;height:68px}.mobile-brand h1{font-size:20px}.name-grid{grid-template-columns:1fr}.tabs{margin-bottom:15px}.field label,label{margin-top:9px}.secure-note{margin-top:14px}}
</style></head>
<body>
<main class="page"><div class="shell">
<section class="brand-panel"><div class="brand"><img src="logo.svg" alt="Habsco logo"><b>HASSAN FINANCE</b></div><div class="brand-copy"><h2>Finance made simple.</h2><p>Secure access to your account and financing.</p></div><div class="brand-foot">Habsco Sadaqah Jariyah Development Trust</div></section>
<section class="auth-area"><div class="card">
<div class="mobile-brand"><img src="logo.svg" alt="Habsco logo"><h1>Hassan Finance</h1></div>
<div class="heading"><div class="eyebrow">MEMBER ACCESS</div><h1 id="formTitle">Welcome back</h1></div>
<div class="tabs"><button id="loginTab" class="active" type="button">LOGIN</button><button id="signupTab" type="button">REGISTER</button></div>
<form id="authForm"><div id="registrationFields" class="hidden"><div class="name-grid"><div class="field"><label for="firstName">First name</label><input id="firstName" type="text" autocomplete="given-name"></div><div class="field"><label for="middleName">Middle name</label><input id="middleName" type="text" autocomplete="additional-name"></div></div><div class="field"><label for="surname">Surname</label><input id="surname" type="text" autocomplete="family-name"></div><div class="field"><label for="nin">NIN</label><input id="nin" type="text" inputmode="numeric" maxlength="11" pattern="[0-9]{11}" autocomplete="off" placeholder="11-digit NIN"></div><div class="field"><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel"></div></div><label for="email">Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Enter password"><div id="confirmField" class="hidden"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password"></div><div id="forgotWrap" class="forgot"><button id="forgotPassword" type="button">Forgot password?</button></div><button class="submit" id="submitBtn" type="submit">LOGIN</button><button class="biometric-login" id="biometricLoginBtn" type="button" aria-label="Verify with Face ID or fingerprint"><svg class="bio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3H6a3 3 0 0 0-3 3v2M16 3h2a3 3 0 0 1 3 3v2M3 16v2a3 3 0 0 0 3 3h2M21 16v2a3 3 0 0 1-3 3h-2M8 8.5A4 4 0 0 1 16 9M7.5 12a4.5 4.5 0 0 0 9 0M9.5 15.5a3 3 0 0 0 5 0"/></svg><span>Face ID / Fingerprint</span></button><div class="bio-hint" id="bioHint">Available after login.</div></form>
<div id="message" class="message" aria-live="polite"></div><div class="secure-note">🔒 <b>Secure access</b></div><div class="back"><a href="finance.html">← Back to Finance</a></div>
</div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.56.0"></script><script src="biometric-gate.js?v=20260912-6"></script><script src="auth.js?v=20260912-6"></script><script src="bottom-nav.js?v=20260912-6"></script>
</body></html>
