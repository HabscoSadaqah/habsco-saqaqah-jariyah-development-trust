font-size:9px;color:#b9d8c8;line-height:1.5;position:relative;z-index:1}.auth-area{padding:56px 60px;display:flex;align-items:center;background:#fff}.card{width:100%;max-width:430px;margin:auto}.mobile-brand{text-align:center;display:none}.mobile-brand-logo{display:flex;align-items:center;justify-content:center;width:84px;height:84px;margin:0 auto;background:#fff;border-radius:50%;padding:8px;line-height:0}.mobile-brand-logo img{display:block;width:100%;height:100%;object-fit:contain;object-position:left center}.mobile-brand h1{font-size:23px;letter-spacing:-.6px;margin:11px 0 0;font-weight:900}.heading{margin-bottom:20px}.heading h1{margin:6px 0 0;font-size:32px;line-height:1.08;letter-spacing:-1.25px;font-weight:850;color:#15261e}.eyebrow{font-size:9px;letter-spacing:1.8px;font-weight:950;color:var(--green)}.tabs{display:flex;gap:4px;background:#edf3ef;padding:4px;border-radius:12px;margin-bottom:21px}.tabs button{flex:1;border:0;background:transparent;color:#78857e;border-radius:9px;height:44px;font-size:10px;font-weight:950;letter-spacing:.7px;cursor:pointer;transition:.18s ease}.tabs button.active{background:#fff;color:var(--green);box-shadow:0 4px 12px #173d2b12}.name-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field,label{display:block}.field label,label{font-size:10px;font-weight:850;color:#34453c;margin:11px 0 7px}.field input,input{width:100%;height:49px;border:1px solid var(--line);border-radius:11px;background:#fbfdfc;padding:0 13px;color:var(--ink);font-size:14px;outline:none;transition:border-color .16s,box-shadow .16s,background .16s}.field input::placeholder,input::placeholder{color:#9aa69f}.field input:focus,input:focus{border-color:#5da982;background:#fff;box-shadow:0 0 0 3px #087a4312}.input-wrap{position:relative}.input-wrap input{padding-right:46px}.password-toggle{position:absolute;right:4px;top:4px;width:41px;height:41px;border:0;background:transparent;color:#708079;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}.password-toggle:hover{background:#eef4f0;color:var(--green)}.password-toggle svg{width:18px;height:18px}.forgot{text-align:right;margin-top:6px}.forgot button{border:0;background:none;color:var(--green);font-size:10px;font-weight:850;cursor:pointer;padding:5px 1px}.submit{width:100%;height:51px;margin-top:17px;border:0;border-radius:11px;background:linear-gradient(135deg,#087a43,#056637);color:#fff;font-size:12px;font-weight:950;letter-spacing:.4px;cursor:pointer;box-shadow:0 8px 20px #087a4322;transition:transform .15s,box-shadow .15s,opacity .15s}.submit:hover{transform:translateY(-1px);box-shadow:0 10px 23px #087a4328}.submit:active{transform:translateY(0)}.submit:disabled{opacity:.6;cursor:wait;transform:none}.biometric-login{width:100%;height:45px;margin-top:10px;border:1px solid #ccd9d2;border-radius:11px;background:#fff;color:#176f47;font-weight:900;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.16s}.biometric-login:hover{background:#f4f9f6;border-color:#a9c8b8}.biometric-login:disabled{opacity:.6}.bio-icon{width:17px;height:17px}.bio-hint{text-align:center;color:#87928c;font-size:8px;margin-top:6px}.message{margin-top:12px;padding:10px 11px;border-radius:9px;display:none;font-size:10px;line-height:1.45}.message.show{display:block}.secure-note{text-align:center;margin-top:18px;padding-top:13px;border-top:1px solid #edf1ee;color:#7b8780;font-size:8px}.secure-note b{color:#405148}.back{text-align:center;margin-top:10px}.back a{color:var(--green);font-size:9px;font-weight:850;text-decoration:none}.back a:hover{text-decoration:underline}.hidden{display:none!important}@media(max-width:780px){.page{padding:0;background:radial-gradient(circle at 50% 0,#dff0e7 0,transparent 44%),#fff}.page:before,.page:after{display:none}.shell{min-height:100vh;width:100%;display:block;border:0;border-radius:0;box-shadow:none}.brand-panel{display:none}.auth-area{min-height:100vh;padding:31px 21px 22px; <body>
<main class="page"><div class="shell">
<section class="brand-panel"><div class="brand"><div class="brand-copy"><h2>Finance made simple.</h2><p>Secure access to your account and financing.</p></div></div><div class="brand-foot">Habsco Sadaqah Jariyah Development Trust</div></section>
<section class="auth-area"><div class="card">
<div class="mobile-brand"><div class="mobile-brand-logo"><img src="logo.svg" alt="Habsco H logo"></div><h1>Hassan Finance</h1></div>
<div class="heading"><div class="eyebrow">MEMBER ACCESS</div><h1 id="formTitle">Welcome back</h1></div>
<div class="tabs"><button id="loginTab" class="active" type="button">LOGIN</button><button id="signupTab" type="button">REGISTER</button></div>
<form id="authForm"><div id="registrationFields" class="hidden"><div class="name-grid"><div class="field"><label for="firstName">First name</label><input id="firstName" type="text" autocomplete="given-name"></div><div class="field"><label for="middleName">Middle name</label><input id="middleName" type="text" autocomplete="additional-name"></div></div><div class="field"><label for="surname">Surname</label><input id="surname" type="text" autocomplete="family-name"></div><div class="field"><label for="nin">NIN</label><input id="nin" type="text" inputmode="numeric" maxlength="11" pattern="[0-9]{11}" autocomplete="off" placeholder="11-digit NIN"></div><div class="field"><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel"></div></div><label for="email">Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label for="password">Password</label><div class="input-wrap"><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Enter password"><button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false"><svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg><svg id="eyeOff" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 18 18M10.6 6.2A9.8 9.8 0 0 1 12 6c6 0 9.5 6 9.5 6a17.6 17.6 0 0 1-3.1 3.5M6.2 6.2C3.9 8.1 2.5 12 2.5 12s3.5 6 9.5 6c1.1 0 2.1-.2 3-.5M9.8 9.8a3.1 3.1 0 0 0 4.4 4.4"/></svg></button></div><div id="confirmField" class="hidden"><label for="confirmPassword">Confirm password</label><div class="input-wrap"><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password"><button class="password-toggle" id="confirmPasswordToggle" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div></div><div id="forgotWrap" class="forgot"><button id="forgotPassword" type="button">Forgot password?</button></div><button class="submit" id="submitBtn" type="submit">LOGIN</button><button class="biometric-login" id="biometricLoginBtn" type="button" aria-label="Verify with Face ID or fingerprint"><svg class="bio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3H6a3 3 0 0 0-3 3v2M16 3h2a3 3 0 0 1 3 3v2M3 16v2a3 3 0 0 0 3 3h2M21 16v2a3 3 0 0 1-3 3v2M8 8.5A4 4 0 0 1 16 9M7.5 12a4.5 4.5 0 0 0 9 0M9.5 15.5a3 3 0 0 0 5 0"/></svg><span>Face ID / Fingerprint</span></button><div class="bio-hint" id="bioHint">Available after login.</div></form>
<div id="message" class="message" aria-live="polite"></div><div class="secure-note">🔒 <b>Secure access</b></div><div class="back"><a href="finance.html">← Back to Finance</a></div>
</div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.56.0"></script><script src="biometric-gate.js?v=20260912-11"></script><script src="auth.js?v=20260912-11"></script><script src="bottom-nav.js?v=20260912-11"></script>
<script>(function(){function setupToggle(btnId,inputId){const b=document.getElementById(btnId),i=document.getElementById(inputId);if(!b||!i)return;b.addEventListener('click',function(){const show=i.type==='password';i.type=show?'text':'password';b.setAttribute('aria-label',show?'Hide password':'Show password');b.setAttribute('aria-pressed',String(show));const open=document.getElementById('eyeOpen'),off=document.getElementById('eyeOff');if(btnId==='passwordToggle'&&open&&off){open.classList.toggle('hidden',show);off.classList.toggle('hidden',!show)}})}setupToggle('passwordToggle','password');setupToggle('confirmPasswordToggle','confirmPassword')})();</script>
</body></html>
