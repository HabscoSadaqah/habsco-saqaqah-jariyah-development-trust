<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hassan Finance | Reset Password</title><link rel="icon" href="favicon.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#17231b}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:500px;background:#fff;border-radius:20px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.1)}.brand{text-align:center}.brand img{width:72px;height:72px}.brand h1{margin:10px 0 4px}.brand p{color:#68736c}.field{margin-top:16px}.field label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #cfd8d1;border-radius:10px;font-size:16px}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#08752f;color:#fff;font-weight:800;font-size:16px}.message{margin-top:15px;padding:12px;border-radius:10px;display:none}.message.show{display:block}.back{text-align:center;margin-top:18px}.back a{color:#08752f;font-weight:700;text-decoration:none}@media(max-width:600px){.wrap{padding:10px}.card{padding:20px;border-radius:14px}}</style></head><body><div class="wrap"><div class="card"><div class="brand"><img src="logo.svg" alt="Habsco Sadaqah Jariyah Development Trust"><h1>Reset Password</h1><p>Hassan Finance</p></div><form id="resetForm"><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password"></div><button id="resetBtn" type="submit">UPDATE PASSWORD</button></form><div id="message" class="message" aria-live="polite"></div><div class="back"><a href="auth.html">← Back to Login</a></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://ythnoeyxovapydbmymdo.supabase.co','sb_publishable_nfSR2tMCFuHCpkOjjNIakw_P85zunsN');const form=document.getElementById('resetForm'),btn=document.getElementById('resetBtn'),msg=document.getElementById('message');function show(t,ok=false){msg.textContent=t;msg.className='message show';msg.style.background=ok?'#e7f6ec':'#fdecec';msg.style.color=ok?'#146b31':'#9b1c1c'};form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8){show('Password must be at least 8 characters.');return}if(p!==c){show('Passwords do not match.');return}btn.disabled=true;btn.textContent='UPDATING…';try{const {error}=await sb.auth.updateUser({password:p});if(error)throw error;show('Password updated successfully. You can now log in with your new password.',true);setTimeout(()=>location.assign('./auth.html'),1200)}catch(err){console.error(err);show(err?.message||'Unable to update password. Please request a new reset link.');btn.disabled=false;btn.textContent='UPDATE PASSWORD'}});</script></body></html>
