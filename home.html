mation-delay:-19.35s}.service-item:nth-child(11){animation-delay:-21.5s}.service-item:nth-child(12){animation-delay:-23.65s}.service-item:nth-child(13){animation-delay:-25.8s}@keyframes orbit{from{transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(min(340px,46vw) * -1)) rotate(calc(var(--a) * -1))}to{transform:translate(-50%,-50%) rotate(calc(var(--a) + 360deg)) translateY(calc(min(340px,46vw) * -1)) rotate(calc((var(--a) + 360deg) * -1))}}

</style><style data-habsco-footer-style>footer .copyright,footer .habsco-copyright{background:transparent!important;color:#8a928d!important;border-top:0!important;text-shadow:none!important;font-size:10px!important;line-height:1.4!important;font-weight:500!important;padding:10px 12px!important;text-align:center!important;letter-spacing:.01em!important}</style></head><body class="finance-page"><main class="finance-shell"><section class="finance-hero"><div class="finance-hero-content"><div class="service-sphere" aria-label="HABSCO services"><div class="service-orbit"></div><span class="service-item" tabindex="0" style="--a:0deg"><span class="ico">💡</span>Bill Payments</span><span class="service-item" tabindex="0" style="--a:27.7deg"><span class="ico">🛒</span>POS Services</span><span class="service-item" tabindex="0" style="--a:55.4deg"><span class="ico">💵</span>Cash Services</span><span class="service-item" tabindex="0" style="--a:83.1deg"><span class="ico">🤝</span>Agent Services</span><span class="service-item" tabindex="0" style="--a:110.8deg"><span class="ico">💰</span>Savings</span><span class="service-item" tabindex="0" style="--a:138.5deg"><span class="ico">📊</span>Shares</span><span class="service-item" tabindex="0" style="--a:166.2deg"><span class="ico">🎯</span>Target Savings</span><span class="service-item" tabindex="0" style="--a:193.9deg"><span class="ico">🤲</span>Interest-Free Loan</span><span class="service-item" tabindex="0" style="--a:221.6deg"><span class="ico">🔄</span>Wallet Transfers</span><span class="service-item" tabindex="0" style="--a:249.3deg"><span class="ico">🏦</span>Bank Transfer</span><span class="service-item" tabindex="0" style="--a:277deg"><span class="ico">❤️</span>Donate</span><span class="service-item" tabindex="0" style="--a:304.7deg"><span class="ico">🏠</span>Waqf</span><span class="service-item" tabindex="0" style="--a:332.4deg"><span class="ico">🌱</span>Sadaqah Jariyah</span></div><div class="finance-hero-brand"><img src="/assets/h (()=>{const hero=document.querySelector('.finance-hero'),items=[...document.querySelectorAll('.service-item')];let active=null,timer;const setTouch=(x,y)=>{const r=hero.getBoundingClientRect();hero.style.setProperty('--touch-x',((x-r.left)/r.width*100)+'%');hero.style.setProperty('--touch-y',((y-r.top)/r.height*100)+'%');hero.classList.add('touching')};const clearTouch=()=>{hero.classList.remove('touching');hero.style.setProperty('--touch-x','50%');hero.style.setProperty('--touch-y','45%')};const activate=(el)=>{if(active&&active!==el)active.classList.remove('active');active=el;el.classList.add('active');clearTimeout(timer);timer=setTimeout(()=>{el.classList.remove('active');if(active===el)active=null},900)};items.forEach(el=>{el.addEventListener('pointerdown',e=>{e.preventDefault();setTouch(e.clientX,e.clientY);activate(el)});el.addEventListener('pointerup',clearTouch);el.addEventListener('pointercancel',clearTouch);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(el)}})});hero.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||hero.classList.contains('touching'))setTouch(e.clientX,e.clientY)});hero.addEventListener('pointerleave',clearTouch)})();
</script></html>
