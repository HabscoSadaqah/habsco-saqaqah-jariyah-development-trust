<!doctype html>
<html lang="en-NG">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HABSCO</title><meta name="description" content="HABSCO business, cooperative financial and charity services.">
<link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css?v=fast-home-2">
<style>
:root{--green:#0b5d31;--gold:#f2c94c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body.finance-page{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#020b07;color:#fff}
.finance-hero{position:relative;width:100%;height:100svh;min-height:600px;overflow:hidden;background:radial-gradient(circle at 50% 48%,#145738 0,#092c1e 34%,#04150e 72%,#020907 100%);--tx:50%;--ty:46%}.finance-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--tx) var(--ty),rgba(242,201,76,.2),transparent 24%),radial-gradient(circle at 50% 48%,rgba(255,255,255,.06),transparent 42%);pointer-events:none;transition:background .2s}.stars{position:absolute;inset:0;opacity:.7;background-image:radial-gradient(circle,rgba(255,255,255,.75) 1px,transparent 1.5px),radial-gradient(circle,rgba(242,201,76,.55) 1px,transparent 1.5px);background-size:83px 83px,137px 137px;background-position:11px 19px,43px 71px;animation:stars 24s linear infinite;pointer-events:none}@keyframes stars{to{background-position:94px 102px,180px 154px}}
.finance-hero-content{position:relative;width:100%;height:100%;display:grid;place-items:center}.finance-hero-brand{position:absolute;top:7.5%;left:50%;transform:translateX(-50%);z-index:50}.finance-hero-brand img{width:min(310px,62vw);max-height:68px;object-fit:contain;filter:brightness(0) invert(1);display:block}
.universe{position:absolute;left:50%;top:51%;width:min(700px,98vw);height:min(700px,98vw);transform:translate(-50%,-50%);perspective:900px;z-index:8;pointer-events:none}.space{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}.orbit{position:absolute;left:50%;top:50%;width:86%;height:86%;border:1px solid rgba(255,255,255,.14);border-radius:50%;transform-style:preserve-3d;box-shadow:0 0 35px rgba(255,255,255,.025) inset;pointer-events:none}.orbit.a{transform:translate(-50%,-50%) rotateX(66deg) rotateZ(18deg)}.orbit.b{transform:translate(-50%,-50%) rotateX(66deg) rotateZ(78deg);opacity:.72}.orbit.c{transform:translate(-50%,-50%) rotateX(66deg) rotateZ(-42deg);opacity:.55}.orbit.d{width:72%;height:72%;transform:translate(-50%,-50%) rotateX(90deg);border-style:dashed;opacity:.45}.axis{position:absolute;left:50%;top:50%;height:96%;width:2px;background:linear-gradient(transparent,rgba(242,201,76,.6),transparent);transform:translate(-50%,-50%) rotateZ(24deg);box-shadow:0 0 14px rgba(242,201,76,.25)}
.core{position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe99a 0,#f2c94c 18%,#126d3d 48%,#082a1c 74%,transparent 76%);box-shadow:0 0 40px rgba(242,201,76,.35),0 0 100px rgba(242,201,76,.13);opacity:.38;pointer-events:none}.core:after{content:"";position:absolute;inset:-12%;border-radius:50%;border:1px solid rgba(242,201,76,.25);box-shadow:0 0 25px rgba(242,201,76,.15) inset}
.service-item{position:absolute;left:50%;top:50%;width:104px;min-height:48px;padding:7px 9px;border:1px solid rgba(11,93,49,.08);border-radius:14px;background:rgba(255,255,255,.97);color:#17452b;box-shadow:0 8px 22px rgba(0,0,0,.28);font-size:9.5px;line-height:1.12;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;text-align:center;cursor:pointer;pointer-events:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;transform-style:preserve-3d;will-change:transform,opacity;transition:width .2s ease,min-height .2s ease,padding .2s ease,font-size .2s ease,box-shadow .2s ease}.service-item .ico{font-size:17px;line-height:1;transition:font-size .2s ease}.service-item.active{width:150px;min-height:72px;padding:12px 14px;font-size:12px;box-shadow:0 18px 48px rgba(0,0,0,.44),0 0 0 3px rgba(242,201,76,.72),0 0 35px rgba(242,201,76,.45);z-index:200}.service-item.active .ico{font-size:28px}
.join-habsco{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);z-index:30;display:inline-flex;align-items:center;justify-content:center;min-width:min(230px,62vw);min-height:58px;padding:14px 30px;border-radius:999px;background:linear-gradient(135deg,#f6d35f,#f2c94c);color:#17321f;font-size:16px;font-weight:900;text-decoration:none;box-shadow:0 12px 35px rgba(0,0,0,.34),0 0 28px rgba(242,201,76,.18);transition:transform .18s ease,box-shadow .18s ease}.join-habsco:hover{transform:translate(-50%,-50%) scale(1.04);box-shadow:0 16px 42px rgba(0,0,0,.42),0 0 35px rgba(242,201,76,.3)}.finance-hero-copyright{position:absolute;bottom:3.5%;left:50%;transform:translateX(-50%);z-index:50;color:rgba(255,255,255,.6);font-size:10px;white-space:nowrap}
@media(max-width:600px){.finance-hero{min-height:100svh}.finance-hero-brand{top:5.5%}.finance-hero-brand img{width:min(245px,66vw);max-height:54px}.universe{width:108vw;height:108vw;top:50%}.service-item{width:82px;min-height:40px;padding:5px 6px;border-radius:11px;font-size:7.5px}.service-item .ico{font-size:14px}.service-item.active{width:120px;min-height:58px;font-size:9.5px}.service-item.active .ico{font-size:22px}.join-habsco{min-width:190px;min-height:50px;font-size:14px}.finance-hero-copyright{bottom:2%;font-size:9px}}@media(prefers-reduced-motion:reduce){.stars{animation:none}}
</style></head>
<body class="finance-page"><main class="finance-shell"><section class="finance-hero"><div class="stars"></div><div class="finance-hero-content">
<div class="finance-hero-brand"><img src="/assets/habsco-wordmark.svg?v=20260917" alt="HABSCO" width="760" height="150"></div>
<div class="universe" aria-label="HABSCO services universe"><div class="space" id="space"><div class="orbit a"></div><div class="orbit b"></div><div class="orbit c"></div><div class="orbit d"></div><div class="axis"></div><div class="core"></div>
<span class="service-item" data-i="0"><span class="ico">💡</span>Bill Payments</span><span class="service-item" data-i="1"><span class="ico">🛒</span>POS Services</span><span class="service-item" data-i="2"><span class="ico">💵</span>Cash Services</span><span class="service-item" data-i="3"><span class="ico">🤝</span>Agent Services</span><span class="service-item" data-i="4"><span class="ico">💰</span>Savings</span><span class="service-item" data-i="5"><span class="ico">📊</span>Shares</span><span class="service-item" data-i="6"><span class="ico">🎯</span>Target Savings</span><span class="service-item" data-i="7"><span class="ico">🤲</span>Interest-Free Loan</span><span class="service-item" data-i="8"><span class="ico">🔄</span>Wallet Transfers</span><span class="service-item" data-i="9"><span class="ico">🏦</span>Bank Transfer</span><span class="service-item" data-i="10"><span class="ico">❤️</span>Donate</span><span class="service-item" data-i="11"><span class="ico">🏠</span>Waqf</span><span class="service-item" data-i="12"><span class="ico">🌱</span>Sadaqah Jariyah</span>
</div></div>
<a class="join-habsco" href="auth.html">Join Us</a><div class="finance-hero-copyright">© 2026 Habsco. All Rights Reserved.</div>
</div></section></main>
<script>
(()=>{const hero=document.querySelector('.finance-hero'),space=document.getElementById('space'),items=[...document.querySelectorAll('.service-item')],n=items.length;let active=null,activeTimer=null,paused=false,angle=0,last=performance.now();
const points=items.map((_,i)=>{const bands=[-48,-32,-16,0,16,32,48,-40,-20,0,20,40,0],lat=bands[i]*Math.PI/180;const lon=(i/n)*Math.PI*2;return{lat,lon,band:i<7?0:i<12?1:2}});
function render(t){const now=t||performance.now(),dt=Math.min(40,now-last);last=now;if(!paused)angle+=dt*.00042;const size=space.clientWidth,R=size*.405;items.forEach((el,i)=>{const p=points[i],spin=angle*(p.band===0?1:p.band===1?1.08:1.16)+p.lon;const x=Math.cos(p.lat)*Math.cos(spin)*R;const y=Math.sin(p.lat)*R;const z=Math.cos(p.lat)*Math.sin(spin)*R;const depth=(z/R+1)/2;const scale=.72+depth*.38;const isActive=el===active;const s=isActive?Math.max(scale,1.13):scale;el.style.transform=`translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),${z}px) scale(${s})`;el.style.zIndex=String(100+Math.round(z));el.style.opacity=isActive?'1':String(.45+depth*.55);});requestAnimationFrame(render)}
function touchGlow(x,y){const r=hero.getBoundingClientRect();hero.style.setProperty('--tx',((x-r.left)/r.width*100)+'%');hero.style.setProperty('--ty',((y-r.top)/r.height*100)+'%')}
function activate(el,e){if(active&&active!==el)active.classList.remove('active');active=el;el.classList.add('active');paused=true;if(e)touchGlow(e.clientX,e.clientY);clearTimeout(activeTimer);activeTimer=setTimeout(()=>{el.classList.remove('active');active=null;paused=false;hero.style.setProperty('--tx','50%');hero.style.setProperty('--ty','46%')},900)}
items.forEach(el=>{el.addEventListener('pointerdown',e=>{e.preventDefault();activate(el,e)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(el)}})});requestAnimationFrame(render)})();
</script></body></html>
