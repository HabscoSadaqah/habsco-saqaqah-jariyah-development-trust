<!doctype html>
<html lang="en-NG">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HABSCO</title><meta name="description" content="HABSCO business, cooperative financial and charity services.">
<link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css?v=fast-home-2">
<style>
:root{--green:#0b5d31;--gold:#f2c94c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body.finance-page{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#020b07;color:#fff}
.finance-hero{position:relative;width:100%;height:100svh;min-height:600px;overflow:hidden;background:radial-gradient(circle at 50% 48%,#145738 0,#092c1e 34%,#04150e 72%,#020907 100%);--tx:50%;--ty:46%}.finance-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--tx) var(--ty),rgba(242,201,76,.2),transparent 24%),radial-gradient(circle at 50% 48%,rgba(255,255,255,.06),transparent 42%);pointer-events:none;transition:background .2s}.stars{position:absolute;inset:0;opacity:.7;background-image:radial-gradient(circle,rgba(255,255,255,.75) 1px,transparent 1.5px),radial-gradient(circle,rgba(242,201,76,.55) 1px,transparent 1.5px);background-size:83px 83px,137px 137px;background-position:11px 19px,43px 71px;animation:stars 24s linear infinite;pointer-events:none}@keyframes stars{to{background-position:94px 102px,180px 154px}}
.finance-hero-content{position:relative;width:100%;height:100%;display:grid;place-items:center}.finance-hero-brand{position:absolute;top:7.5%;left:50%;transform:translateX(-50%);z-index:50}.finance-hero-brand img{width:min(310px,62vw);max-height:68px;object-fit:contain;filter:brightness(0) invert(1);display:block}
.universe{position:absolute;left:50%;top:51%;width:min(700px,98vw);height:min(700px,98vw);transform:translate(-50%,-50%);perspective:900px;z-index:8;pointer-events:none}.space{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}.orbit{position:absolute;left:50%;top:50%;width:86%;height:86%;border:1px solid rgba(255,255,255,.14);border-radius:50%;transform-style:preserve-3d;box-shadow:0 0 35px rgba(255,255,255,.025) inset;pointer-events:none}.orbit.a{width:86%;height:48%;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.42);box-shadow:0 0 28px rgba(255,255,255,.08),0 0 45px rgba(242,201,76,.08) inset}.orbit.b,.orbit.c,.orbit.d{display:none}.axis{position:absolute;left:50%;top:50%;height:96%;width:2px;background:linear-gradient(transparent,rgba(242,201,76,.6),transparent);transform:translate(-50%,-50%) rotateZ(24deg);box-shadow:0 0 14px rgba(242,201,76,.25)}
.connections{position:absolute;inset:0;width:100%;height:100%;z-index:15}.core{position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe99a 0,#f2c94c 18%,#126d3d 48%,#082a1c 74%,transparent 76%);box-shadow:0 0 40px rgba(242,201,76,.35),0 0 100px rgba(242,201,76,.13);opacity:.96;pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:250;transition:box-shadow .2s ease,filter .2s ease}.core:after{content:"";position:absolute;inset:-12%;border-radius:50%;border:1px solid rgba(242,201,76,.3);box-shadow:0 0 25px rgba(242,201,76,.15) inset}.core-label{position:relative;z-index:2;color:#17321f;font-size:clamp(13px,2.5vw,18px);font-weight:950;letter-spacing:.02em;text-align:center;text-shadow:0 1px 0 rgba(255,255,255,.25);pointer-events:none}.core:hover{box-shadow:0 0 55px rgba(242,201,76,.65),0 0 120px rgba(242,201,76,.25)}.core{animation:joinPulse 2.4s ease-in-out infinite}.core:before{content:"";position:absolute;inset:-22%;border-radius:50%;border:2px solid rgba(242,201,76,.32);box-shadow:0 0 18px rgba(242,201,76,.18);animation:joinRing 2.4s ease-out infinite;pointer-events:none}.core-label{animation:joinLabel 1.8s ease-in-out infinite}@keyframes joinPulse{0%,100%{transform:translate(-50%,-50%) scale(1);filter:brightness(1)}50%{transform:translate(-50%,-50%) scale(1.08);filter:brightness(1.16)}}@keyframes joinRing{0%{transform:scale(.78);opacity:.7}70%,100%{transform:scale(1.18);opacity:0}}@keyframes joinLabel{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}.core.core-rotating{animation:coreSpin .9s cubic-bezier(.2,.75,.25,1) both!important;filter:brightness(1.18)}@keyframes coreSpin{0%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}35%{transform:translate(-50%,-50%) rotate(180deg) scale(1.08)}70%{transform:translate(-50%,-50%) rotate(540deg) scale(1.13)}100%{transform:translate(-50%,-50%) rotate(720deg) scale(1)}}
.connection{position:absolute;left:50%;top:50%;height:1px;width:var(--line,0px);background:linear-gradient(90deg,rgba(242,201,76,.55),rgba(255,255,255,.18));transform-origin:0 50%;pointer-events:none;z-index:20;opacity:.5}.service-item{position:absolute;left:50%;top:50%;width:72px;height:72px;min-height:72px;padding:5px;border:2px solid rgba(255,255,255,.96);border-radius:50%;background:radial-gradient(circle at 30% 24%,#ffffff 0,#fdfdfd 18%,#e8e8e8 42%,#bfc5c2 70%,#6f7773 100%);color:#084a28;box-shadow:inset -9px -10px 16px rgba(0,0,0,.28),inset 7px 6px 13px rgba(255,255,255,.95),0 7px 20px rgba(0,0,0,.42),0 0 18px rgba(255,255,255,.3);font-size:8px;line-height:1.12;font-weight:800;display:flex;align-items:center;justify-content:center;gap:2px;text-align:center;cursor:pointer;pointer-events:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;transform-style:preserve-3d;will-change:transform,opacity;transition:width .2s ease,min-height .2s ease,padding .2s ease,font-size .2s ease,box-shadow .2s ease}.service-item .ico{font-size:19px;line-height:1;transition:font-size .2s ease;display:block}.service-item{white-space:normal;overflow:hidden}.service-item:not(.active){word-break:normal}.service-item.active{width:98px;height:98px;min-height:98px;font-size:10px;box-shadow:0 18px 48px rgba(0,0,0,.44),0 0 0 3px rgba(242,201,76,.72),0 0 35px rgba(242,201,76,.45);z-index:200}.service-item.active .ico{font-size:27px}
.finance-hero-copyright{position:absolute;bottom:3.5%;left:50%;transform:translateX(-50%);z-index:50;color:rgba(255,255,255,.6);font-size:10px;white-space:nowrap}
@media(max-width:600px){.finance-hero{min-height:100svh}.finance-hero-brand{top:5.5%}.finance-hero-brand img{width:min(245px,66vw);max-height:54px}.universe{width:108vw;height:108vw;top:50%}.service-item{width:58px;height:58px;min-height:58px;padding:4px;border-radius:50%;font-size:7px}.service-item .ico{font-size:16px}.service-item.active{width:78px;height:78px;min-height:78px;font-size:8px}.service-item.active .ico{font-size:21px}.core-label{font-size:12px}.finance-hero-copyright{bottom:2%;font-size:9px}}@media(prefers-reduced-motion:reduce){.stars{animation:none}}
</style><style data-habsco-footer-style>footer .copyright,footer .habsco-copyright{background:transparent!important;color:#8a928d!important;border-top:0!important;text-shadow:none!important;font-size:10px!important;line-height:1.4!important;font-weight:500!important;padding:10px 12px!important;text-align:center!important;letter-spacing:.01em!important}</style></head>
<body class="finance-page"><main class="finance-shell"><section class="finance-hero"><div class="stars"></div><div class="finance-hero-content">
<div class="finance-hero-brand"><img src="/assets/habsco-wordmark.svg?v=20260917" alt="HABSCO" width="760" height="150"></div>
<div class="universe" aria-label="HABSCO services universe"><div class="space" id="space"><div class="orbit a"></div><div class="orbit b"></div><div class="orbit c"></div><div class="orbit d"></div><div class="axis"></div><svg class="connections" id="connections" aria-hidden="true"></svg><div class="core" id="joinCore" role="button" tabindex="0" aria-label="Join HABSCO"><span class="core-label">Join Us</span></div>
<span class="service-item" data-i="0"><span class="ico">💡</span>Electricity</span><span class="service-item" data-i="1"><span class="ico">🐷</span>Savings</span><span class="service-item" data-i="2"><span class="ico">🤝</span>Shares</span><span class="service-item" data-i="3"><span class="ico">💰</span>Loan Account</span><span class="service-item" data-i="4"><span class="ico">💎</span>Dividend Account</span><span class="service-item" data-i="5"><span class="ico">🤲</span>Charity</span><span class="service-item" data-i="6"><span class="ico">💬</span>Contact</span>
</div></div>
<div class="finance-hero-copyright">© 2026 Habsco. All Rights Reserved.</div>
</div></section></main>
<script>
(()=>{const hero=document.querySelector('.finance-hero'),space=document.getElementById('space'),core=document.getElementById('joinCore'),items=[...document.querySelectorAll('.service-item')],n=items.length;let active=null,activeTimer=null,paused=false,angle=0,last=performance.now();const svg=document.getElementById('connections');
const lines=items.map(()=>{const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('stroke','rgba(242,201,76,.42)');l.setAttribute('stroke-width','1');svg.appendChild(l);return l});const points=items.map((_,i)=>{const bands=[-30,-20,-10,0,10,20,30],lat=bands[i]*Math.PI/180;const lon=(i/n)*Math.PI*2;return{lat,lon,band:0}});
function render(t){const now=t||performance.now(),dt=Math.min(40,now-last);last=now;if(!paused)angle+=dt*.00042;const size=space.clientWidth,R=size*.43;svg.setAttribute('viewBox',`0 0 ${size} ${size}`);svg.setAttribute('width',size);svg.setAttribute('height',size);svg.style.position='absolute';svg.style.inset='0';svg.style.overflow='visible';svg.style.pointerEvents='none';items.forEach((el,i)=>{const p=points[i],spin=angle+p.lon;const x=Math.cos(spin)*R;const y=Math.sin(spin)*R*.43;const z=Math.sin(spin)*R;const depth=(z/R+1)/2;const scale=.78+depth*.22;const isActive=el===active;const s=isActive?Math.max(scale,1.13):scale;el.style.transform=`translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),${z}px) scale(${s})`;el.style.zIndex=String(100+Math.round(z));el.style.opacity=isActive?'1':String(.45+depth*.55);const lx=size/2+x,ly=size/2+y;const coreR=size*.15,ballR=(isActive?49:36)*s;const dx=x,dy=y,dist=Math.max(1,Math.hypot(dx,dy));const sx=size/2+dx/dist*coreR,sy=size/2+dy/dist*coreR;const ex=lx-dx/dist*ballR,ey=ly-dy/dist*ballR;lines[i].setAttribute('x1',sx);lines[i].setAttribute('y1',sy);lines[i].setAttribute('x2',ex);lines[i].setAttribute('y2',ey);lines[i].style.opacity=String(.22+.38*depth)});requestAnimationFrame(render)}
function touchGlow(x,y){const r=hero.getBoundingClientRect();hero.style.setProperty('--tx',((x-r.left)/r.width*100)+'%');hero.style.setProperty('--ty',((y-r.top)/r.height*100)+'%')}
function activate(el,e){if(active&&active!==el)active.classList.remove('active');active=el;el.classList.add('active');paused=true;if(e)touchGlow(e.clientX,e.clientY);clearTimeout(activeTimer);activeTimer=setTimeout(()=>{el.classList.remove('active');active=null;paused=false;hero.style.setProperty('--tx','50%');hero.style.setProperty('--ty','46%')},900)}
items.forEach(el=>{el.addEventListener('pointerdown',e=>{e.preventDefault();activate(el,e)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(el)}})});
let joining=false;function join(){if(joining)return;joining=true;paused=true;core.classList.add('core-rotating');core.setAttribute('aria-busy','true');hero.style.setProperty('--tx','50%');hero.style.setProperty('--ty','51%');angle+=Math.PI*2;setTimeout(()=>{window.location.href='auth.html'},850)}core.addEventListener('click',join);core.addEventListener('pointerdown',e=>{e.stopPropagation();touchGlow(e.clientX,e.clientY)});core.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();join()}});requestAnimationFrame(render)})();
</script><footer class="habsco-standard-footer"><div class="copyright habsco-copyright">© 2026 Habsco. All Rights Reserved.</div></footer></body></html>
