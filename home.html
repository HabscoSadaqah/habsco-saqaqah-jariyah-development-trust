<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HABSCO</title><meta name="description" content="HABSCO business, cooperative financial and charity services."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css?v=fast-home-1"><style>
html{scroll-behavior:smooth}
body.finance-page{margin:0;background:#f5f8f5;color:#17321f;font-family:Inter,Arial,Helvetica,sans-serif;overflow-x:hidden}
.finance-shell{width:100%;min-height:100svh}
.finance-hero{min-height:100svh;background:linear-gradient(180deg,#0c5b2d 0%,#0f6332 38%,#f5f8f5 38%,#f5f8f5 100%);color:#17321f}
.finance-hero-content{width:100%;min-height:100svh;margin:auto;padding:18px 14px 24px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center}
.finance-hero-brand{margin:4px 0 14px;display:flex;justify-content:center}.finance-hero-brand img{display:block;width:min(300px,72vw);height:auto;max-height:62px;object-fit:contain;filter:brightness(0) invert(1)}
.join-habsco{display:inline-flex;align-items:center;justify-content:center;margin:0 0 9px;padding:12px 27px;border-radius:999px;background:#f3c94d;color:#17321f;font-size:14px;font-weight:900;text-decoration:none;box-shadow:0 5px 14px rgba(0,0,0,.14)}
.swipe-hint{margin:0 0 12px;color:rgba(255,255,255,.78);font-size:10px;font-weight:700;letter-spacing:.2px}
.finance-hero-services{width:100%;max-width:1100px;margin:0 auto}
.finance-service-group{width:100%;margin:0}.service-group-title{text-align:left;color:#fff;font-size:12px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;margin:0 0 8px}.service-group-title span{display:block;margin-top:2px;font-size:8px;font-weight:600;letter-spacing:0;text-transform:none;opacity:.72}
.finance-service-grid{width:100%;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:3px 3px 16px;box-sizing:border-box;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain}.finance-service-grid::-webkit-scrollbar{display:none}
.finance-card{position:relative;flex:0 0 88vw;width:88vw;min-height:58svh;max-height:640px;padding:28px 22px;box-sizing:border-box;border:1px solid #e2ebe4;border-radius:26px;background:rgba(255,255,255,.98);color:#17321f;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;gap:16px;scroll-snap-align:center;box-shadow:0 8px 24px rgba(27,58,39,.08);overflow:hidden}
.finance-card:active{transform:scale(.995)}
.finance-card-icon{width:60px;height:60px;display:grid;place-items:center;border-radius:18px;background:#edf5ef;color:#0c6a35}.finance-card-icon svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.card-guide{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;min-height:86px}.card-cartoon{position:relative;width:62px;height:68px;flex:0 0 62px;border-radius:48% 48% 45% 45%;background:#ffe6c9;border:2px solid #d9c2a8;box-shadow:inset 0 -8px 0 rgba(0,0,0,.035)}.card-cartoon:before,.card-cartoon:after{content:"";position:absolute;top:23px;width:7px;height:7px;border-radius:50%;background:#17321f}.card-cartoon:before{left:15px}.card-cartoon:after{right:15px}.card-mouth{position:absolute;left:22px;bottom:12px;width:16px;height:7px;border-bottom:3px solid #17321f;border-radius:0 0 12px 12px}.card-hat{position:absolute;left:4px;top:-9px;width:46px;height:16px;border-radius:12px 12px 4px 4px;background:#f3c94d;border:2px solid #fff}
.card-speech{position:relative;max-width:260px;background:#f3f7f3;color:#294b35;border:1px solid #e1ebe3;border-radius:15px;padding:11px 13px;font-size:11px;line-height:1.4;font-weight:700;text-align:left}.card-speech:after{content:"";position:absolute;left:-7px;bottom:13px;border-width:6px 7px 6px 0;border-style:solid;border-color:transparent #e1ebe3 transparent transparent}
.finance-card h2{margin:0;font-size:clamp(21px,5vw,30px);line-height:1.15;font-weight:900;color:#123d23}.finance-card small{font-size:9px;color:#73907d;font-weight:800;letter-spacing:1px}.finance-card .service-info{display:block;margin:7px auto 0;max-width:390px;font-size:11px;line-height:1.5;color:#698072}.finance-card>b{display:none}
.service-hint{margin:4px 0 0;text-align:center;color:#809087;font-size:9px;font-weight:700}
.finance-hero-copyright{margin-top:auto;padding-top:12px;font-size:10px;color:#dce8e1;text-align:center}
@media(min-width:701px){.finance-card{flex-basis:min(780px,78vw);width:min(780px,78vw);min-height:500px}.finance-service-grid{padding-left:calc((100% - min(780px,78vw))/2);padding-right:calc((100% - min(780px,78vw))/2)}}
@media(max-width:700px){.finance-hero-content{padding:14px 9px 20px}.finance-card{flex-basis:calc(100vw - 24px);width:calc(100vw - 24px);min-height:58svh;padding:24px 18px}.card-speech{max-width:190px;font-size:10px}.finance-card .service-info{font-size:10px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.finance-service-grid{scroll-behavior:auto}}
</style></style><style data-habsco-footer-style>footer .copyright,footer .habsco-copyright{background:transparent!important;color:#8a928d!important;border-top:0!important;text-shadow:none!important;font-size:10px!important;line-height:1.4!important;font-weight:500!important;padding:10px 12px!important;text-align:center!important;letter-spacing:.01em!important}</style></head><body class="finance-page"><main class="finance-shell"><section class="finance-hero"><div class="finance-hero-grid" aria-hidden="true"></div><div class="finance-hero-ring ring-one" aria-hidden="true"></div><div class="finance-hero-ring ring-two" aria-hidden="true"></div><div class="finance-hero-content"><div class="finance-hero-brand"><img src="/assets/habsco-wordmark.svg?v=20260917" alt="HABSCO" width="760" height="150"></div><a class="join-habsco" href="auth.html">Join Us</a><div class="swipe-hint">Swipe left or right to explore services</div><div class="finance-home-spacer" aria-hidden="true"></div></section><div class="finance-hero-copyright">© 2026 Habsco. All Rights Reserved.</div></div></section></main><footer class="habsco-standard-footer"><div class="copyright habsco-copyright">© 2026 Habsco. All Rights Reserved.</div></footer><script>(function(){const row=document.querySelector('.finance-service-grid');if(!row)return;const cards=[...row.querySelectorAll('.finance-card')];let i=0,timer,paused=false;function advance(){if(paused||cards.length<2)return;i=(i+1)%cards.length;cards[i].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}function start(){clearInterval(timer);timer=setInterval(advance,6000)}['touchstart','pointerdown','mouseenter','focusin'].forEach(e=>row.addEventListener(e,()=>{paused=true;clearInterval(timer)}));['touchend','pointerup','mouseleave','focusout'].forEach(e=>row.addEventListener(e,()=>{paused=false;start()}));start()})();</script></body></html>
