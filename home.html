<!doctype html>
<html lang="en-NG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HABSCO</title>
<meta name="description" content="HABSCO business, cooperative financial and charity services.">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css?v=fast-home-1">
<style>
:root{--green:#0b5d31;--green2:#0f7040;--gold:#f2c94c;--ink:#17321f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body.finance-page{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#061b12;color:#fff}
.finance-hero{position:relative;width:100%;height:100svh;min-height:600px;overflow:hidden;background:radial-gradient(circle at 50% 46%,#124f32 0,#092b1d 32%,#04150e 72%,#020b07 100%);--tx:50%;--ty:46%}
.finance-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--tx) var(--ty),rgba(242,201,76,.22),transparent 24%),radial-gradient(circle at 50% 45%,rgba(255,255,255,.055),transparent 42%);pointer-events:none;transition:background .2s ease}
.stars{position:absolute;inset:0;opacity:.72;background-image:radial-gradient(circle,rgba(255,255,255,.75) 1px,transparent 1.5px),radial-gradient(circle,rgba(242,201,76,.5) 1px,transparent 1.5px);background-size:83px 83px,137px 137px;background-position:11px 19px,43px 71px;animation:starDrift 24s linear infinite;pointer-events:none}
@keyframes starDrift{to{background-position:94px 102px,180px 154px}}
.finance-hero-content{position:relative;width:100%;height:100%;display:grid;place-items:center}
.finance-hero-brand{position:absolute;top:7.5%;left:50%;transform:translateX(-50%);z-index:20}.finance-hero-brand img{width:min(310px,62vw);max-height:68px;object-fit:contain;filter:brightness(0) invert(1);display:block}
.universe{position:absolute;left:50%;top:51%;width:min(680px,96vw);height:min(680px,96vw);transform:translate(-50%,-50%);perspective:1100px;z-index:8;pointer-events:none}
.globe{position:absolute;inset:0;transform-style:preserve-3d;animation:globeSpin 22s linear infinite;will-change:transform}
@keyframes globeSpin{from{transform:rotateX(18deg) rotateY(0deg) rotateZ(-8deg)}to{transform:rotateX(18deg) rotateY(360deg) rotateZ(-8deg)}}
.globe.paused{animation-play-state:paused}
.core{position:absolute;left:50%;top:50%;width:32%;height:32%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 36% 30%,#ffe99a 0,#f2c94c 20%,#0f7040 48%,#08291b 76%,transparent 77%);box-shadow:0 0 35px rgba(242,201,76,.4),0 0 95px rgba(242,201,76,.13);opacity:.34}
.ring{position:absolute;left:50%;top:50%;width:86%;height:86%;border:1px solid rgba(255,255,255,.13);border-radius:50%;transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(68deg);box-shadow:0 0 35px rgba(255,255,255,.025) inset}.ring.r2{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(60deg);opacity:.75}.ring.r3{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-60deg);opacity:.6}.ring.r4{width:72%;height:72%;transform:translate(-50%,-50%) rotateX(90deg);border-style:dashed;opacity:.5}
.axis{position:absolute;left:50%;top:50%;width:1px;height:105%;background:linear-gradient(transparent,rgba(242,201,76,.5),transparent);transform:translate(-50%,-50%) rotateZ(18deg);box-shadow:0 0 12px rgba(242,201,76,.25)}
.service-item{position:absolute;left:50%;top:50%;width:104px;min-height:48px;padding:7px 9px;border:1px solid rgba(11,93,49,.08);border-radius:14px;background:rgba(255,255,255,.96);color:#17452b;box-shadow:0 8px 22px rgba(0,0,0,.25);font-size:9.5px;line-height:1.12;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;text-align:center;cursor:pointer;pointer-events:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;transform-style:preserve-3d;transition:width .22s ease,min-height .22s ease,padding .22s ease,font-size .22s ease,box-shadow .22s ease,filter .22s ease;will-change:transform}
.service-item .ico{font-size:17px;line-height:1;flex:0 0 auto;transition:font-size .22s ease}.service-item.active{width:150px;min-height:72px;padding:12px 14px;font-size:12px;box-shadow:0 18px 48px rgba(0,0,0,.42),0 0 0 3px rgba(242,201,76,.7),0 0 35px rgba(242,201,76,.45);filter:brightness(1.05);z-index:100}.service-item.active .ico{font-size:28px}
.join-habsco{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);z-index:30;display:inline-flex;align-items:center;justify-content:center;min-width:min(230px,62vw);min-height:58px;padding:14px 30px;border-radius:999px;background:linear-gradient(135deg,#f6d35f,#f2c94c);color:#17321f;font-size:16px;font-weight:900;letter-spacing:.15px;text-decoration:none;box-shadow:0 12px 35px rgba(0,0,0,.34),0 0 28px rgba(242,201,76,.18);transition:transform .18s ease,box-shadow .18s ease}.join-habsco:hover{transform:translate(-50%,-50%) scale(1.04);box-shadow:0 16px 42px rgba(0,0,0,.42),0 0 35px rgba(242,201,76,.3)}
.finance-hero-copyright{position:absolute;bottom:3.5%;left:50%;transform:translateX(-50%);z-index:20;color:rgba(255,255,255,.6);font-size:10px;white-space:nowrap}.habsco-standard-footer{display:none}
@media(max-width:600px){.finance-hero{min-height:100svh}.finance-hero-brand{top:5.5%}.finance-hero-brand img{width:min(245px,66vw);max-height:54px}.universe{width:106vw;height:106vw;top:50%}.service-item{width:82px;min-height:40px;padding:5px 6px;border-radius:11px;font-size:7.5px}.service-item .ico{font-size:14px}.service-item.active{width:120px;min-height:58px;font-size:9.5px}.service-item.active .ico{font-size:22px}.join-habsco{min-width:190px;min-height:50px;font-size:14px}.finance-hero-copyright{bottom:2%;font-size:9px}}
@media(prefers-reduced-motion:reduce){.globe,.stars{animation:none}}
</style>
</head>
<body class="finance-page">
<main class="finance-shell"><section class="finance-hero">
<div class="stars"></div>
<div class="finance-hero-content">
<div class="finance-hero-brand"><img src="/assets/habsco-wordmark.svg?v=20260917" alt="HABSCO" width="760" height="150"></div>
<div class="universe" aria-label="HABSCO services universe"><div class="globe" id="globe"><div class="core"></div><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div><div class="axis"></div>
<span class="service-item" data-i="0"><span class="ico">💡</span>Bill Payments</span><span class="service-item" data-i="1"><span class="ico">🛒</span>POS Services</span><span class="service-item" data-i="2"><span class="ico">💵</span>Cash Services</span><span class="service-item" data-i="3"><span class="ico">🤝</span>Agent Services</span><span class="service-item" data-i="4"><span class="ico">💰</span>Savings</span><span class="service-item" data-i="5"><span class="ico">📊</span>Shares</span><span class="service-item" data-i="6"><span class="ico">🎯</span>Target Savings</span><span class="service-item" data-i="7"><span class="ico">🤲</span>Interest-Free Loan</span><span class="service-item" data-i="8"><span class="ico">🔄</span>Wallet Transfers</span><span class="service-item" data-i="9"><span class="ico">🏦</span>Bank Transfer</span><span class="service-item" data-i="10"><span class="ico">❤️</span>Donate</span><span class="service-item" data-i="11"><span class="ico">🏠</span>Waqf</span><span class="service-item" data-i="12"><span class="ico">🌱</span>Sadaqah Jariyah</span>
</div></div>
<a class="join-habsco" href="auth.html">Join Us</a>
<div class="finance-hero-copyright">© 2026 Habsco. All Rights Reserved.</div>
</div></section></main>
<script>
(()=>{const hero=document.querySelector('.finance-hero'),globe=document.getElementById('globe'),items=[...document.querySelectorAll('.service-item')];let active=null,timer;const n=items.length;
function place(){const w=globe.clientWidth,R=w*.40;items.forEach((el,i)=>{const lat=[-48,-30,-12,6,24,42,-42,-24,-6,12,30,48,0][i]*Math.PI/180;const lon=(i/n)*Math.PI*2;const x=Math.cos(lat)*Math.cos(lon)*R,y=Math.sin(lat)*R,z=Math.cos(lat)*Math.sin(lon)*R;el.style.transform=`translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),${z}px)`;el.style.zIndex=String(100+Math.round(z));el.style.opacity=String(.62+.38*((z/R+1)/2));el.style.filter=`brightness(${.78+.22*((z/R+1)/2)})`})}
function setTouch(x,y){const r=hero.getBoundingClientRect();hero.style.setProperty('--tx',((x-r.left)/r.width*100)+'%');hero.style.setProperty('--ty',((y-r.top)/r.height*100)+'%')}
function activate(el){if(active&&active!==el)active.classList.remove('active');active=el;el.classList.add('active');globe.classList.add('paused');clearTimeout(timer);timer=setTimeout(()=>{el.classList.remove('active');if(active===el)active=null;globe.classList.remove('paused')},900)}
items.forEach(el=>{el.addEventListener('pointerdown',e=>{e.preventDefault();setTouch(e.clientX,e.clientY);activate(el)});el.addEventListener('pointerup',()=>hero.style.setProperty('--tx','50%'));el.addEventListener('pointercancel',()=>hero.style.setProperty('--tx','50%'));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(el)}})});
window.addEventListener('resize',place,{passive:true});place();
})();
</script>
</body></html>
